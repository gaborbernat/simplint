requires = [ "tox>=4.67.4", "tox-uv>=1.37.2" ]
env_list = [ "3.15", "3.14", "3.13", "3.12", "3.11", "docs", "fix", "pkg_meta", "pkg_sdist", "tasks", "type" ]
skip_missing_interpreters = true

[env_run_base]
runner = "uv-venv-runner"
description = "run the wheel tests under {env_name}"
default_base_python = [ "3.15" ]
package = "wheel"
wheel_build_env = ".pkg"
dependency_groups = [ "test" ]
pass_env = [ "PYTEST_*", "SSL_CERT_FILE" ]
set_env.COVERAGE_FILE = { replace = "env", name = "COVERAGE_FILE", default = "{work_dir}{/}.coverage.{env_name}" }
commands = [
  [
    "pytest",
    { replace = "posargs", default = [
      "--durations",
      "5",
      "--junitxml",
      "{work_dir}{/}junit.{env_name}.xml",
      "--no-cov-on-fail",
      "--cov",
      "{tox_root}{/}tests{/}wheel",
      "--cov-config",
      "{tox_root}{/}pyproject.toml",
      "--cov-context",
      "test",
      "--cov-report",
      "term-missing:skip-covered",
      "--cov-report",
      "html:{env_tmp_dir}{/}htmlcov",
      "--cov-report",
      "xml:{work_dir}{/}coverage.{env_name}.xml",
      "tests{/}wheel",
    ], extend = true },
  ],
]

[env_pkg_base]
default_base_python = [ "3.15" ]

[env.docs]
description = "build documentation"
# The diagrams are drawn at build time by mermaid-cli, which conf.py runs through npx, so Node.js must be on PATH. Its
# puppeteer downloads a headless browser on first use; PUPPETEER_SKIP_DOWNLOAD=1 with PUPPETEER_EXECUTABLE_PATH runs an
# installed one instead.
pass_env = [ "PUPPETEER_*", "SSL_CERT_FILE" ]
base_python = [ "3.15" ]
# The pages read the rule list from the rule sources and the options from docs/_data, so Read the Docs builds them
# without compiling Rust.
skip_install = true
dependency_groups = [ "docs" ]
commands = [
  [ "python", "-m", "tasks.generate_changelog" ],
  [
    "sphinx-build",
    "-d",
    "{env_tmp_dir}{/}docs_tree",
    "docs",
    "{env:READTHEDOCS_OUTPUT:{work_dir}{/}docs_out}/html",
    "--color",
    "-b",
    "html",
    "-j",
    "auto",
    "-W",
  ],
  [
    "python",
    "-c",
    'print(r"documentation available under file://{work_dir}{/}docs_out{/}html{/}index.html")',
  ],
]

[env.docs_links]
description = "check the documentation's external links"
pass_env = { replace = "ref", of = [ "env", "docs", "pass_env" ] }
base_python = { replace = "ref", of = [ "env", "docs", "base_python" ] }
skip_install = { replace = "ref", of = [ "env", "docs", "skip_install" ] }
dependency_groups = { replace = "ref", of = [ "env", "docs", "dependency_groups" ] }
commands = [
  [ "python", "-m", "tasks.python_links", "src{/}rules" ],
  [ "python", "-m", "tasks.generate_changelog" ],
  [
    "sphinx-build",
    "-d",
    "{env_tmp_dir}{/}docs_tree",
    "docs",
    "{work_dir}{/}docs_linkcheck",
    "--color",
    "-b",
    "linkcheck",
    "-W",
  ],
]

[env.examples]
description = "compile the rule-page examples under CPython 3.10 to 3.15"
dependency_groups = []
deps = [ "uv>=0.13.6" ]
commands = [
  [
    "python",
    "-m",
    "tasks.compile_examples",
    "--simplint",
    "{env_bin_dir}{/}simplint",
    "--python",
    "3.10",
    "--python",
    "3.11",
    "--python",
    "3.12",
    "--python",
    "3.13",
    "--python",
    "3.14",
    "--python",
    "3.15",
    { replace = "posargs", extend = true },
  ],
]

[env.fix]
description = "run the repository hooks"
skip_install = true
dependency_groups = [ "fix" ]
commands = [ [ "pre-commit", "run", "--all-files", "--show-diff-on-failure" ] ]

[env.pkg_meta]
description = "validate package metadata"
skip_install = true
dependency_groups = [ "pkg-meta" ]
commands = [
  [
    "uv",
    "build",
    "--sdist",
    "--wheel",
    "--out-dir",
    "{env_tmp_dir}",
    ".",
  ],
  [
    "twine",
    "check",
    "{env_tmp_dir}{/}*",
  ],
  # a binary wheel carries only the script, so its library is empty by design
  [
    "check-wheel-contents",
    "--no-config",
    "--ignore",
    "W007",
    "{env_tmp_dir}",
  ],
]

[env.pkg_sdist]
description = "build and test the source distribution"
skip_install = true
dependency_groups = [ "test" ]
commands = [ [ "python", "tasks{/}check_sdist.py" ] ]

[env.ecosystem]
description = "lint and fix the most downloaded PyPI projects, failing on crashes and on fixes that break code"
dependency_groups = []
# The Ruff the crates are built from, so a Ruff release cannot change the outcome on its own.
deps = [ "ruff==0.17.4" ]
commands = [
  [
    "python",
    "-m",
    "tasks.ecosystem",
    "--cache",
    "{work_dir}{/}ecosystem-cache",
    "--simplint",
    "{env_bin_dir}{/}simplint",
    { replace = "posargs", extend = true },
  ],
]

[env.tasks]
description = "run the maintenance task tests"
skip_install = true
dependency_groups = [ "test", "docs" ]
deps = [ "uv>=0.13.6" ]
set_env.PYTHONPATH = "{tox_root}{/}tasks"
commands = [
  [
    "python",
    "-m",
    "pytest",
    { replace = "posargs", default = [
      "--cov",
      "{tox_root}{/}tasks",
      "--cov",
      "{tox_root}{/}docs",
      "--cov",
      "{tox_root}{/}tests{/}tasks",
      "--cov-config",
      "{tox_root}{/}pyproject.toml",
      "--cov-report",
      "term-missing:skip-covered",
      "tests{/}tasks",
    ], extend = true },
  ],
]

[env.type]
description = "run type checks"
skip_install = true
dependency_groups = [ "type", "docs" ]
commands = [ [ "mypy", "tasks", "tests" ], [ "mypy", "docs" ] ]

[env.dev]
description = "create a development environment at {envdir}"
dependency_groups = [ "dev" ]
commands = [
  [ "uv", "pip", "tree" ],
  [ "simplint", "--version" ],
  [ "python", "-c", 'print(r"{env_python}")' ],
]
