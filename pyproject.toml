[build-system]
build-backend = "maturin"
requires = [
  "maturin>=1.15,<2",
]

[project]
name = "simplint"
description = "Ruff companion linter with extra checks that make Python easier to read and review"
readme = { file = "README.rst", content-type = "text/x-rst" }
keywords = [
  "linter",
  "python",
  "ruff",
  "style",
]
license = "MIT"
license-files = [ "LICENSE.txt" ]
authors = [
  { name = "Bernat Gabor", email = "gaborjbernat@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
dynamic = [
  "version",
]
urls."Bug Tracker" = "https://github.com/gaborbernat/simplint/issues"
urls."Source Code" = "https://github.com/gaborbernat/simplint"
urls.Changelog = "https://github.com/gaborbernat/simplint/blob/main/CHANGELOG.md"
urls.Documentation = "https://simplint.readthedocs.io/en/latest/"
urls.Homepage = "https://github.com/gaborbernat/simplint"

[dependency-groups]
dev = [
  { include-group = "fix" },
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "covdefaults>=2.3",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "pytest-mock>=3.16",
  "trove-classifiers>=2026.9.21.13",
]
type = [
  "mypy==2.4",
  "tox>=4.65.5",
  "types-docutils>=0.22",
  { include-group = "test" },
]
docs = [
  "furo>=2025.12.19; python_version>='3.14'",
  "myst-parser>=5; python_version>='3.14'",
  "pypandoc-binary>=1.17; python_version>='3.14'",
  "release-creator>=4.1; python_version>='3.15'",
  "sphinx>=9.1; python_version>='3.14'",
  "sphinx-argparse-cli>=1.24; python_version>='3.14'",
  "sphinx-copybutton>=0.5.2; python_version>='3.14'",
  "sphinx-design>=0.7; python_version>='3.14'",
  "sphinx-inline-tabs>=2025.12.21.14; python_version>='3.14'",
  "sphinx-llm>=1.1",
  "sphinxcontrib-mermaid>=1; python_version>='3.14'",
]
build = [
  "cython>=3",
  "maturin>=1.15,<2",
  "setuptools>=80",
]
fix = [
  "pre-commit-uv>=4.4",
]
pkg-meta = [
  "check-wheel-contents>=0.6.3",
  "twine>=7",
  "uv>=0.13.1",
]
release-build = [
  "cython>=3",
  "maturin>=1.15,<2",
  "setuptools>=80",
]
release-notes = [
  "release-creator>=4.1",
]
release-prepare = [
  "prek>=0.3",
  "release-creator>=4.1",
]

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
include = [
  { path = "docs/", format = "sdist" },
  { path = "README.rst", format = "sdist" },
  { path = "rust-toolchain.toml", format = "sdist" },
  { path = "src/rules/*/*.md", format = "sdist" },
]
exclude = [
  "**/*.pyc",
  "**/*.pyo",
  "**/__pycache__/**",
]

[tool.uv]
dependency-groups.release-build = { requires-python = ">=3.15" }
dependency-groups.release-notes = { requires-python = ">=3.15" }
dependency-groups.release-prepare = { requires-python = ">=3.15" }

[tool.ruff]
line-length = 120
extend-exclude = [ "tests/fixtures" ]
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "CPY",                                       # the project omits copyright headers
  "D1",                                        # names and types document the code
  "DOC",                                       # documentation rules conflict with the docstring-free style
  "incorrect-blank-line-before-class",         # incompatible with D211
  "missing-trailing-comma",                    # conflicts with the formatter
  "multi-line-summary-first-line",             # incompatible with D213
  "single-line-implicit-string-concatenation", # conflicts with the formatter
]
lint.per-file-ignores."docs/*.py" = [
  "subprocess-without-shell-equals-true", # runs the simplint binary built for the docs
  "suspicious-subprocess-import",         # runs the simplint binary built for the docs
]
lint.per-file-ignores."tasks/**.py" = [
  "implicit-namespace-package",           # tasks are scripts, not a package
  "print",                                # tasks report progress
  "start-process-with-partial-path",      # tox resolves uv from PATH
  "subprocess-without-shell-equals-true", # the build commands are ours, not untrusted input
  "suspicious-subprocess-import",         # build tasks invoke child processes
  "suspicious-url-open-usage",            # fetches named hosts
]
lint.per-file-ignores."tests/**/*.py" = [
  "assert",                               # asserts allowed in tests
  "D",                                    # test names document behavior
  "FBT",                                  # positional booleans keep cases compact
  "implicit-namespace-package",           # test modules are not packages
  "magic-value-comparison",               # assertions need literal expected values
  "subprocess-without-shell-equals-true", # tests pass trusted commands
  "suspicious-subprocess-import",         # the wheel tests run the installed binary
]
lint.isort = { known-first-party = [
  "tasks",
], required-imports = [
  "from __future__ import annotations",
] }
lint.preview = true

[tool.codespell]
builtin = "clear,usage,en-GB_to_en-US"
ignore-words = "ignore-words.txt"
skip = "*.snap,tests/fixtures/*,pylock.toml"
write-changes = true
count = true

[tool.mypy]
# the rule fixtures are linted, not run, and break type rules on purpose
exclude = [ "^tests/fixtures/" ]
# tasks/ and tests/ are directories of scripts; name their modules from the repository root
explicit_package_bases = true
strict = true
overrides = [ { module = [ "pypandoc" ], follow_untyped_imports = true } ]
show_error_codes = true

[tool.coverage]
run.parallel = true
run.plugins = [
  "covdefaults",
]
paths.source = [
  "tasks",
  "**/tasks",
  "**\\tasks",
]
report.fail_under = 100
html.show_contexts = true
html.skip_covered = false

[tool.nab]
mode = "universal"
base-group = "project-runtime"
default-groups = []
uploaded-prior-to = "P7D"
decision-order = "stable"
matrix.python = ">=3.15,<3.16"
matrix.platforms = [ "linux_x86_64" ]
# release-creator 4.1 is younger than the seven-day cutoff; the override can go once it ages past it
packages.release-creator.uploaded-prior-to = 2026-10-26T18:24:46Z
