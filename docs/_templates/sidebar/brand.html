{% extends "!sidebar/brand.html" %}
{#- Reserve the wordmark's space before the image loads. Lazy loading lets the browser skip the hidden theme. #}
{% block brand_content %}
<div class="sidebar-logo-container">
  <img class="sidebar-logo only-light" src="{{ pathto('_static/' + theme_light_logo, 1) }}" alt="simplint" width="576" height="162" loading="lazy"/>
  <img class="sidebar-logo only-dark" src="{{ pathto('_static/' + theme_dark_logo, 1) }}" alt="simplint" width="576" height="162" loading="lazy"/>
</div>
{% endblock brand_content %}
