[package]
name = "simplint"
version = "0.1.0"
edition = "2024"
description = "Ruff companion linter with extra checks that make Python easier to read and review"
license = "MIT"
repository = "https://github.com/gaborbernat/simplint"
rust-version = "1.99"

[dependencies]
anyhow = "1.0.104"
bitflags = "2.13.2"
cachedir = "0.3.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete_command = { version = "0.6.1", default-features = false, features = ["nushell"] }
clearscreen = { version = "4.0.6", default-features = false }
colored = "3.1.1"
filetime = "0.2.29"
globset = "0.4.21"
itertools = "0.15.0"
# Ruff's `notify_user!` macro, used in watch mode, expands to calls into jiff.
jiff = "0.2.38"
log = "0.4.34"
notify = { version = "8.2.1", default-features = false, features = ["macos_fsevent"] }
rayon = "1.12.0"
rkyv = { version = "0.8.18", features = ["bytecheck", "std"] }
ruff = "=0.17.3"
ruff_cache = "=0.0.20"
ruff_db = { version = "=0.0.20", features = ["serde", "junit", "os"] }
ruff_diagnostics = "=0.0.20"
ruff_graph = "=0.0.20"
ruff_linter = "=0.17.3"
ruff_macros = "=0.0.20"
ruff_options_metadata = { version = "=0.0.20", features = ["serde"] }
ruff_python_ast = "=0.0.20"
ruff_python_codegen = "=0.0.20"
ruff_python_index = "=0.0.20"
ruff_python_parser = "=0.0.20"
ruff_python_semantic = "=0.0.20"
ruff_python_stdlib = "=0.0.20"
ruff_python_trivia = "=0.0.20"
ruff_source_file = "=0.0.20"
ruff_text_size = "=0.0.20"
ruff_workspace = "=0.0.20"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.1.8"
ty_module_resolver = "=0.0.20"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
test-case = "3.4.0"

[target.'cfg(all(not(target_os = "windows"), not(target_os = "openbsd"), not(target_os = "aix"), not(target_os = "android"), any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "powerpc64", target_arch = "riscv64")))'.dependencies]
tikv-jemallocator = { version = "0.6.1", default-features = false, features = ["background_threads_runtime_support"] }

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, features = ["v2"] }

# Ruff's release profile: fat LTO, and a single codegen unit for the crates that gain most from the costlier
# optimization.
[profile.release]
lto = "fat"
codegen-units = 16
# Stripped here rather than by maturin, whose extra rustc flag would make the wheel build a separate artifact.
strip = "symbols"

[profile.release.package.ruff_python_parser]
codegen-units = 1

[profile.release.package.ruff_python_ast]
codegen-units = 1

[profile.release.package.salsa]
codegen-units = 1

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
