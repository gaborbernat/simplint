[package]
name = "simplint"
version = "0.14.7"
edition = "2024"
description = "Ruff companion linter with extra checks that make Python easier to read and review"
license = "MIT"
repository = "https://github.com/gaborbernat/simplint"
rust-version = "1.99"

[dependencies]
anyhow = "1.0.105"
bitflags = "2.13.2"
cachedir = "0.3.1"
clap = { version = "4.6.9", features = ["derive", "env"] }
clap_complete_command = { version = "0.6.1", default-features = false, features = ["nushell"] }
clearscreen = { version = "5.0.0", default-features = false }
colored = "3.1.1"
fern = "0.7.1"
filetime = "0.2.30"
globset = "0.4.22"
ignore = "0.4.35"
itertools = "0.15.0"
jiff = "1.0.2"
log = "0.4.35"
memchr = "2.8.3"
notify = { version = "9.0.0", default-features = false, features = ["macos_fsevent"] }
rayon = "1.12.0"
rkyv = { version = "0.8.18", features = ["bytecheck", "std"] }
ruff = "=0.17.6"
ruff_cache = "=0.0.23"
ruff_db = { version = "=0.0.23", features = ["serde", "junit", "os"] }
ruff_diagnostics = "=0.0.23"
ruff_formatter = "=0.0.23"
ruff_graph = "=0.0.23"
ruff_linter = { version = "=0.17.6", features = ["schemars"] }
ruff_macros = "=0.0.23"
ruff_options_metadata = { version = "=0.0.23", features = ["serde"] }
ruff_python_ast = "=0.0.23"
ruff_python_codegen = "=0.0.23"
ruff_python_formatter = "=0.0.23"
ruff_python_index = "=0.0.23"
ruff_python_parser = "=0.0.23"
ruff_python_semantic = "=0.0.23"
ruff_python_stdlib = "=0.0.23"
ruff_python_trivia = "=0.0.23"
ruff_source_file = "=0.0.23"
ruff_text_size = "=0.0.23"
ruff_workspace = "=0.0.23"
rustc-hash = "2.1.3"
schemars = { version = "1.2.3", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
supports-hyperlinks = "3.2.0"
tempfile = "3.27.0"
toml = "1.2.2"
unicode-normalization = "0.1.26"
url = "2.5.9"
ty_module_resolver = "=0.0.23"
walkdir = "2.5.1"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
test-case = "3.4.1"
similar = "3.2.1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.191"

[target.'cfg(all(not(target_os = "windows"), not(target_os = "openbsd"), not(target_os = "aix"), not(target_os = "android"), any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "powerpc64", target_arch = "riscv64")))'.dependencies]
tikv-jemallocator = { version = "0.6.1", default-features = false, features = ["background_threads_runtime_support"] }

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, features = ["v2"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

# Reserve single-codegen-unit optimization for the parser, AST and salsa crates.
[profile.release]
lto = "fat"
codegen-units = 16
# Stripped here rather than by maturin, whose extra rustc flag would make the wheel build a separate artifact.
strip = "symbols"

[profile.release.package.ruff_python_parser]
codegen-units = 1

[profile.release.package.ruff_python_ast]
codegen-units = 1

[profile.release.package.salsa]
codegen-units = 1

# CI uses more codegen units and skips LTO to reduce build time.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 256

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
