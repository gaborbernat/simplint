[package]
name = "simplint"
version = "0.1.0"
edition = "2024"
description = "Ruff companion linter enforcing the simp house style"
license = "MIT"
repository = "https://github.com/gaborbernat/simplint"
rust-version = "1.99"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.21"
ignore = "0.4.34"
rayon = "1.12.0"
ruff_diagnostics = "=0.0.20"
ruff_python_ast = "=0.0.20"
ruff_python_codegen = "=0.0.20"
ruff_python_parser = "=0.0.20"
ruff_python_stdlib = "=0.0.20"
ruff_python_trivia = "=0.0.20"
ruff_source_file = "=0.0.20"
ruff_text_size = "=0.0.20"
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.2.1"
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
tempfile = "3.27.0"
test-case = "3.4.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
