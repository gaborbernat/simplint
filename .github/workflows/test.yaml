name: Check package lookups on Windows ARM64
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-windows:
    name: 🧪 test @ windows-11-arm
    runs-on: windows-11-arm
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 🧹 Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: 🦀 Install cargo-nextest
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-nextest
      - name: 🧪 Run the platform-dependent tests
        run: >-
          cargo nextest run --locked -E "test(siblings_share_package_status) | test(absolute_sibling_import) | binary(input) | binary(cache) | binary(fix) | binary(check) | binary(watch) | binary(suppressions)"
