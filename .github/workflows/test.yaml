name: 🧪 test
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    name: 🧭 Detect changes
    runs-on: ubuntu-26.04
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.run == 'true' }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🧭 Detect changed paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            run:
              - 'src/**'
              - 'tests/**'
              - 'docs/**'
              - 'tasks/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'pyproject.toml'
              - 'tox.toml'
              - 'codecov.yml'
              - '.github/workflows/test.yaml'
  hooks:
    # Runs every hook over the tree, so a file a hook would rewrite fails here rather than in the scheduled jobs that
    # run them before opening a PR. The hooks install as the release installs them, with packages published in the
    # last seven days held back, so a hook bumped to a fresh release fails here too, not when a release is prepared.
    name: 🧹 hooks under the release cooldown
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install prek
        run: uv tool install prek
      - name: 🧹 Run the hooks as the release installs them
        uses: tox-dev/github-workflows/cooled-prek@6.8.1
        env:
          # builds the linter from this checkout, which the examples job lints the repository with
          SKIP: simplint
        with:
          args: run --all-files --show-diff-on-failure
  clippy:
    name: 🧹 clippy
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 🧹 Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
  fmt:
    name: 🧹 fmt
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: rustfmt
          cache: false
      - name: 🧹 Check formatting
        run: cargo fmt --check
  test:
    name: 🧪 test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-26.04
    environment: test
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: llvm-tools-preview
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 🦀 Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2.90.0
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: 🧪 Run tests with coverage
        run: cargo llvm-cov nextest --locked --ignore-filename-regex 'fix/errors\.rs' --fail-uncovered-lines 0 --show-missing-lines --codecov --output-path coverage.json
      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.json
          disable_search: true
          # A pull request from a fork gets no token, so only its upload may fail.
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  # The Linux wheel has its own job, so the jobs that test it start without waiting for the slower platforms.
  wheel-linux:
    name: 📦 wheel @ ubuntu-26.04
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # The wheel build reuses this binary from target/, so a Rust error shows in its own step.
      - name: 🏗️ Build the binary
        run: cargo build --profile ci --locked
      # The binary is the same for every Python, so one wheel serves all the test cells.
      - name: 📦 Build the wheel
        run: uv build --python 3.15 --wheel --out-dir dist
        env:
          MATURIN_PEP517_ARGS: --profile ci
      - name: 📤 Upload the wheel
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wheel-ubuntu-26.04
          path: dist/*.whl
          if-no-files-found: error
  # Windows and macOS build the wheel and test it in one job, as nothing else uses their wheels.
  wheel:
    name: 📦 wheel @ ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26]
    env:
      # maturin sets this when unset, which changes the build and makes it compile again what cargo just built
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 🏗️ Build the binary
        run: cargo build --profile ci --locked
      - name: 📦 Build the wheel
        run: uv build --python 3.15 --wheel --out-dir dist
        env:
          MATURIN_PEP517_ARGS: --profile ci
      - name: 📦 Set up test suite
        shell: bash
        run: tox run -vv --notest --skip-missing-interpreters false --installpkg dist/*.whl -e 3.15
      - name: 🧪 Run test suite
        run: tox run --skip-pkg-install -e 3.15
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
  # The suite runs on Linux; Windows runs the tests of the code that differs there: file locking, paths, line endings.
  test-windows:
    name: 🧪 test @ windows-2025
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-2025
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 🦀 Install cargo-nextest
        uses: taiki-e/install-action@v2.90.0
        with:
          tool: cargo-nextest
      - name: 🧪 Run the platform-dependent tests
        run: cargo nextest run --locked --test cache --test check --test fix --test input --test suppressions --test watch
  # The wheel holds one binary whatever the Python, so the oldest supported one stands for all.
  py:
    name: 🧪 3.11 @ ubuntu-26.04
    needs: [changes, wheel-linux]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: 🐍 Install Python 3.11
        run: uv python install --python-preference only-managed 3.11
      - name: 📥 Download the wheel
        uses: actions/download-artifact@v8.0.2
        with:
          name: wheel-ubuntu-26.04
          path: dist
      - name: 📦 Set up test suite
        shell: bash
        run: tox run -vv --notest --skip-missing-interpreters false --installpkg dist/*.whl -e 3.11
      - name: 🧪 Run test suite
        run: tox run --skip-pkg-install -e 3.11
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
  ecosystem:
    # Lints and fixes the pinned top PyPI projects, so a rule or fix that breaks real code fails here and not for users.
    name: 🌍 ecosystem
    needs: [changes, wheel-linux]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: 📥 Download the wheel
        uses: actions/download-artifact@v8.0.2
        with:
          name: wheel-ubuntu-26.04
          path: dist
      # The task checks each archive's hash before using it, so an older set only saves the downloads it shares.
      - name: 📦 Restore the pinned projects
        id: projects
        uses: actions/cache/restore@v6.1.0
        with:
          path: .tox/ecosystem-cache
          key: ecosystem-${{ hashFiles('tasks/ecosystem.py') }}
          restore-keys: ecosystem-
      - name: 📦 Set up the ecosystem check
        shell: bash
        run: tox run -vv --notest --installpkg dist/*.whl -e ecosystem
      - name: 🌍 Lint and fix the projects
        run: tox run --skip-pkg-install -e ecosystem
      # Saved when the check fails too, as the downloads do not depend on its outcome.
      - name: 💾 Save the pinned projects
        if: ${{ always() && steps.projects.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: .tox/ecosystem-cache
          key: ${{ steps.projects.outputs.cache-primary-key }}
  check:
    name: 🔍 ${{ matrix.env }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        env: [type, docs, pkg_meta, pkg_sdist, tasks]
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: 🦀 Install Rust toolchain
        if: matrix.env == 'pkg_meta' || matrix.env == 'pkg_sdist'
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache-key: ${{ matrix.env }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 🟢 Install Node.js, which draws the documentation diagrams
        if: matrix.env == 'docs'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      # docs/conf.py pins mermaid-cli, which npx fetches together with the browser its puppeteer downloads
      - name: 📦 Restore mermaid-cli and its browser
        if: matrix.env == 'docs'
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.npm/_npx
            ~/.cache/puppeteer
          key: mermaid-cli-${{ hashFiles('docs/conf.py') }}
      - name: 📦 Set up test suite
        if: matrix.env != 'docs'
        run: tox run -vv --notest --skip-missing-interpreters false -e ${{ matrix.env }}
      # installs mermaid-cli and its browser while tox sets up the environment, as Read the Docs does
      - name: 📦 Set up the docs environment and mermaid-cli
        if: matrix.env == 'docs'
        run: uv run --no-project python -m tasks.prepare_docs docs/conf.py tox
      - name: 🧪 Run test suite
        run: tox run --skip-pkg-install -e ${{ matrix.env }}
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
  # Both only need a working binary, so they share one unoptimized build.
  examples:
    name: 📖 examples and self-lint
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: 🐍 Install the Python releases the examples compile under
        run: uv python install 3.10 3.11 3.12 3.13 3.14 3.15
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 🏗️ Build the binary
        run: cargo build --locked
      - name: 🧹 Lint the repository with this checkout
        run: target/debug/simplint check
      - name: 🧪 Compile the rule examples
        run: tox run --skip-pkg-install -e examples -- --simplint target/debug/simplint
  all-pass:
    name: 🚦 test
    if: always()
    needs: [changes, hooks, clippy, fmt, test, wheel-linux, wheel, test-windows, py, check, examples, ecosystem]
    runs-on: ubuntu-26.04
    steps:
      - name: 🚦 Decide whether all jobs passed or were skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Some jobs failed or were canceled"
            exit 1
          fi
          echo "All jobs passed or were skipped"
