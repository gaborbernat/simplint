name: 🛡️ CodeQL
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 9 * * 2"
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  analyze:
    name: 🛡️ Analyze
    uses: tox-dev/github-workflows/.github/workflows/codeql.yaml@9389742ac547afdfd13f32ac3fbeeb7c286e88bc # 6.8.2
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["actions","python","rust"]'
      paths-ignore: '["**/tests"]'
