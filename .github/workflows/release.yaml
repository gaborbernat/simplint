name: 🚀 release
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  notes:
    name: 📝 Render GitHub Release notes
    uses: $/.github/workflows/_release_notes.yaml
    permissions:
      contents: read
  build:
    name: 🏗️ Build distributions
    uses: $/.github/workflows/build.yaml
    permissions:
      contents: read
      pull-requests: read
  pypi:
    name: 🚀 Publish to PyPI
    if: github.repository == 'gaborbernat/simplint'
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/simplint/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📩 Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: simplint-wheels-*
          path: dist
          merge-multiple: true
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
  verify:
    name: 🔍 Verify PyPI distributions
    needs:
      - build
      - pypi
    uses: $/.github/workflows/_reconcile_package.yaml
    permissions:
      contents: read
    with:
      package: simplint
      version: ${{ needs.build.outputs.version }}
      artifact-pattern: simplint-wheels-*
  github-release:
    name: 🚀 Publish GitHub Release
    needs: [build, verify, notes]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: 📩 Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.notes.outputs.artifact-id }}
          path: ${{ runner.temp }}
      - name: 🚀 Publish GitHub release
        uses: tox-dev/github-workflows/publish-github-release@57a765127aae73adf7d0e24a7fe0f067f2d3ea3e # 6.2.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes.md
