name: 🚀 release
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  notes:
    name: 📝 Render GitHub Release notes
    uses: tox-dev/github-workflows/.github/workflows/release-notes.yaml@e406a30296cdc06197691769fd40843ddd8c7eb0 # 6.5.1
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
      changelog: CHANGELOG.md
      artifact-url: https://pypi.org/project/simplint/${{ github.ref_name }}/
  build:
    name: 🏗️ Build distributions
    uses: $/.github/workflows/build.yaml
    permissions:
      contents: read
      pull-requests: read
  pypi:
    name: 🚀 Publish to PyPI
    if: github.repository == 'gaborbernat/simplint'
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/simplint/${{ github.ref_name }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📩 Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: simplint-wheels-*
          path: dist
          merge-multiple: true
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
  github-release:
    name: 🚀 Publish GitHub Release
    needs: [build, pypi, notes]
    uses: tox-dev/github-workflows/.github/workflows/github-release.yaml@e406a30296cdc06197691769fd40843ddd8c7eb0 # 6.5.1
    permissions:
      contents: write
    with:
      project: simplint
      version: ${{ github.ref_name }}
      tag: ${{ github.ref_name }}
      artifact-pattern: simplint-wheels-*
      notes-artifact-id: ${{ needs.notes.outputs.artifact-id }}
