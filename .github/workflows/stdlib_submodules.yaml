name: 🔀 stdlib submodules
on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * 1"
permissions: {}
jobs:
  regenerate:
    name: 📦 Regenerate the standard library submodule table
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The generator lists paths with git ls-tree. Use a blobless fetch for the historical refs and put the
      # checkout under the ignored target directory.
      - name: 📥 Check out CPython
        uses: actions/checkout@v7.0.1
        with:
          repository: python/cpython
          path: target/cpython
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: rustfmt
      - name: ⚙️ Regenerate the table
        run: uv run tasks/stdlib_submodules.py target/cpython
      # Hooks can reformat the generated changes. Retry once to check the formatted files.
      - name: 🧹 Run prek
        run: uvx prek run --all-files || uvx prek run --all-files
      - name: 📝 Save the changes
        id: diff
        run: |
          git diff HEAD --binary >"$RUNNER_TEMP/maintenance.patch"
          if [ -s "$RUNNER_TEMP/maintenance.patch" ]; then echo "changed=true"; else echo "changed=false"; fi >>"$GITHUB_OUTPUT"
      - name: 📤 Upload maintenance patch
        id: upload
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: maintenance-patch
          path: ${{ runner.temp }}/maintenance.patch
          if-no-files-found: error
  pr:
    name: 🔀 Open stdlib submodules PR
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    uses: tox-dev/github-workflows/.github/workflows/open-maintenance-pr.yaml@b34c57a8a06e7b043c2ddd0b6b7a8a778d7aa8f7 # 6.8.5
    with:
      artifact-id: ${{ needs.regenerate.outputs.artifact-id }}
      allowed-paths: src/rules/imports/stdlib_submodules.rs
      branch: update-stdlib-submodules
      title: Refresh the standard library submodule table
      body: Update the CPython submodule table used by dependency-import-guard (SMP303).
      labels: skip news
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
