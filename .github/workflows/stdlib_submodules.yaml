name: 🔀 stdlib submodules
on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * 1"
permissions: {}
jobs:
  regenerate:
    name: 📦 Regenerate the standard library submodule table
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Only trees are read, so a blobless clone keeps every tag and branch without downloading the sources.
      - name: 📥 Check out CPython
        uses: actions/checkout@v7.0.1
        with:
          repository: python/cpython
          path: ${{ runner.temp }}/cpython
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          components: rustfmt
      - name: ⚙️ Regenerate the table
        run: uv run tasks/stdlib_submodules.py ${{ runner.temp }}/cpython
      # The first pass applies formatting hooks (mdformat rewrites the generated file), which fails it; the second
      # verifies the formatted output, so the saved patch carries the formatting.
      - name: 🧹 Run prek
        run: uvx prek run --all-files || uvx prek run --all-files
      # A run with nothing new opens no PR; the shared workflow rejects an empty patch.
      - name: 📝 Save the changes
        id: diff
        run: |
          git diff HEAD --binary >"$RUNNER_TEMP/maintenance.patch"
          if [ -s "$RUNNER_TEMP/maintenance.patch" ]; then echo "changed=true"; else echo "changed=false"; fi >>"$GITHUB_OUTPUT"
      - name: 📤 Upload maintenance patch
        id: upload
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: maintenance-patch
          path: ${{ runner.temp }}/maintenance.patch
          if-no-files-found: error
  pr:
    name: 🔀 Open stdlib submodules PR
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    uses: tox-dev/github-workflows/.github/workflows/open-maintenance-pr.yaml@81a3fc661be49ecdc4ea4af99a69fa3879b3d7a1 # 6.8.1
    with:
      artifact-id: ${{ needs.regenerate.outputs.artifact-id }}
      allowed-paths: src/rules/imports/stdlib_submodules.rs
      branch: update-stdlib-submodules
      title: Refresh the standard library submodule table
      body: Regenerate the submodules SMP303 reads from the CPython Lib/ trees, as tasks/stdlib_submodules.py does.
      labels: skip news
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
