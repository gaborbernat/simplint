on:
  workflow_call:
    inputs:
      run:
        required: false
        type: string
        default: "true"
        description: "When 'false', skip the build jobs but still post the aggregate gate"
      release-build:
        required: false
        type: boolean
        default: false
        description: Build the exact version from a protected release tag
    outputs:
      version:
        value: ${{ jobs.bump.outputs.version }}
permissions:
  contents: read
jobs:
  bump:
    name: 🏷️ Bump version
    if: ${{ inputs.run == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      maturin-version: ${{ steps.maturin.outputs.version }}
      source-date-epoch: ${{ steps.source-date-epoch.outputs.value }}
      source-artifact-id: ${{ steps.source.outputs.artifact-id }}
    steps:
      - name: 🦀 Install Rust toolchain
        if: ${{ !inputs.release-build }}
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: 🦀 Install cargo-edit
        if: ${{ !inputs.release-build }}
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-edit
          version: 0.13.13
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ⚙️ Read source timestamp
        id: source-date-epoch
        run: echo "value=$(git log -1 --format=%ct)" >>"$GITHUB_OUTPUT"
      - name: 🐍 Set up Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        env:
          UV_VENV_SEED: "true"
        with:
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: "3.15"
      - name: 📦 Install locked build tool
        uses: tox-dev/github-workflows/install-locked-tools@57a765127aae73adf7d0e24a7fe0f067f2d3ea3e # 6.2.1
        with:
          groups: release-build
          venv: ${{ runner.temp }}/release-tools
      - name: ⚙️ Read locked maturin version
        id: maturin
        run: |
          version=$("$RUNNER_TEMP/release-tools/bin/maturin" --version)
          printf 'version=v%s\n' "${version#maturin }" >>"$GITHUB_OUTPUT"
      - name: 🏷️ Bump version
        if: ${{ !inputs.release-build }}
        run: cargo set-version --bump "$RELEASE_TYPE"
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release != null && github.event.inputs.release != 'no' && github.event.inputs.release || 'patch' }}
      - name: ⚙️ Read package version
        id: version
        run: |
          version=$(python3 tasks/cargo_version.py Cargo.toml)
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: 🧹 Run pre-commit
        if: ${{ !inputs.release-build }}
        uses: tox-dev/action-pre-commit-uv@4de52c139ed1a6963bcc4c30042c4ef9d75d8b11 # v1.1.0
        continue-on-error: true
      - name: 📖 Generate README.rst
        if: ${{ !inputs.release-build }}
        run: python3 tasks/generate_readme.py
      - name: 🔍 Show changes
        if: ${{ !inputs.release-build }}
        run: git diff HEAD -u
      - name: 📤 Upload source
        id: source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simplint-source
          path: |
            .
            !.git
          compression-level: 9
          retention-days: 1
          if-no-files-found: "error"
  linux:
    name: 🏗️ ${{ matrix.platform.target }}
    needs: [bump]
    runs-on: ${{ matrix.platform.runner }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.bump.outputs.source-date-epoch }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {runner: ubuntu-26.04, target: x86_64, manylinux: "2_28"}
          - {runner: ubuntu-26.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2}
          - {runner: ubuntu-26.04, target: aarch64, manylinux: "2_28", zig: true}
          - {runner: ubuntu-26.04, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, zig: true}
          - {runner: ubuntu-26.04, target: riscv64gc-unknown-linux-gnu, manylinux: "2_31"}
    steps:
      - name: 📩 Download source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bump.outputs.source-artifact-id }}
      - name: 🏗️ Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.bump.outputs.maturin-version }}
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist --target-dir target ${{ matrix.platform.zig && '--zig' || '' }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          docker-options: --env SOURCE_DATE_EPOCH
          sccache: ${{ !inputs.release-build }}
      - name: 📤 Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simplint-wheels-linux-${{ matrix.platform.target }}
          path: dist
  windows:
    name: 🏗️ ${{ matrix.platform.target }}
    needs: [bump]
    runs-on: ${{ matrix.platform.runner }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.bump.outputs.source-date-epoch }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {runner: windows-2025, target: x64, python: "3.15"}
          - {runner: windows-11-arm, target: aarch64, python: "3.15"}
    steps:
      - name: 📩 Download source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bump.outputs.source-artifact-id }}
      - name: 🐍 Set up Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        env:
          UV_VENV_SEED: "true"
        with:
          ignore-empty-workdir: true
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: ${{ matrix.platform.python }}
      - name: 🏗️ Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.bump.outputs.maturin-version }}
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist --target-dir target
          # The action installs sccache from PyPI, whose newest release predates the fix for MSVC's `-Tp <file>`
          # (mozilla/sccache#2904), so wrapping cl.exe breaks building mimalloc's C++ source.
          sccache: false
      - name: 📤 Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simplint-wheels-windows-${{ matrix.platform.target }}
          path: dist
  macos:
    name: 🏗️ ${{ matrix.platform.target }}
    needs: [bump]
    runs-on: ${{ matrix.platform.runner }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.bump.outputs.source-date-epoch }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {runner: macos-26, target: x86_64}
          - {runner: macos-26, target: aarch64}
    steps:
      - name: 📩 Download source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bump.outputs.source-artifact-id }}
      - name: 🏗️ Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.bump.outputs.maturin-version }}
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist --target-dir target
          sccache: ${{ !inputs.release-build }}
      - name: 📤 Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simplint-wheels-macos-${{ matrix.platform.target }}
          path: dist
  sdist:
    name: 🏗️ sdist
    needs: [bump]
    runs-on: ubuntu-26.04
    env:
      SOURCE_DATE_EPOCH: ${{ needs.bump.outputs.source-date-epoch }}
    steps:
      - name: 📩 Download source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bump.outputs.source-artifact-id }}
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          ignore-empty-workdir: true
          version: latest-known
          python-version: "3.15"
      - name: 📦 Export locked build constraints
        id: constraints
        uses: tox-dev/github-workflows/export-build-constraints@57a765127aae73adf7d0e24a7fe0f067f2d3ea3e # 6.2.1
      - name: 🏗️ Build sdist
        run: uv build --build-constraints "$BUILD_CONSTRAINTS" --sdist --out-dir dist .
        shell: bash
        env:
          BUILD_CONSTRAINTS: ${{ steps.constraints.outputs.path }}
          UV_REQUIRE_BUILD_HASHES: "true"
      - name: 📤 Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simplint-wheels-sdist
          path: dist
  all-pass:
    name: 🚦 build
    if: always()
    needs: [bump, linux, windows, macos, sdist]
    runs-on: ubuntu-26.04
    steps:
      - name: 🚦 Decide whether all jobs passed or were skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Some jobs failed or were canceled"
            exit 1
          fi
          echo "All jobs passed or were skipped"
