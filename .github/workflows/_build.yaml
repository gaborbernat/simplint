on:
  workflow_call:
    inputs:
      run:
        required: false
        type: string
        default: "true"
        description: "When 'false', skip the build jobs but still post the aggregate gate"
      release-build:
        required: false
        type: boolean
        default: false
        description: Build the exact version from a protected release tag
      pgo:
        required: false
        type: boolean
        default: false
        description: Profile-guided optimization outside a release build, to try the pipeline on a branch
    outputs:
      version:
        value: ${{ jobs.bump.outputs.version }}
permissions:
  contents: read
jobs:
  bump:
    name: 🏷️ Bump version
    if: ${{ inputs.run == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      maturin-version: ${{ steps.maturin.outputs.version }}
      source-date-epoch: ${{ steps.source-date-epoch.outputs.value }}
      source-artifact-id: ${{ steps.source.outputs.artifact-id }}
    steps:
      - name: 🦀 Install Rust toolchain
        if: ${{ !inputs.release-build }}
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: 🦀 Install cargo-edit
        if: ${{ !inputs.release-build }}
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-edit
          version: 0.13.14
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ⚙️ Read source timestamp
        id: source-date-epoch
        run: echo "value=$(git log -1 --format=%ct)" >>"$GITHUB_OUTPUT"
      - name: 🐍 Set up Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        env:
          UV_VENV_SEED: "true"
        with:
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: "3.15"
      - name: 📦 Install locked build tool
        uses: tox-dev/github-workflows/install-locked-tools@57a765127aae73adf7d0e24a7fe0f067f2d3ea3e # 6.2.1
        with:
          groups: release-build
          venv: ${{ runner.temp }}/release-tools
      - name: ⚙️ Read locked maturin version
        id: maturin
        run: |
          version=$("$RUNNER_TEMP/release-tools/bin/maturin" --version)
          printf 'version=v%s\n' "${version#maturin }" >>"$GITHUB_OUTPUT"
      - name: 🏷️ Bump version
        if: ${{ !inputs.release-build }}
        run: cargo set-version --bump "$RELEASE_TYPE"
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release != null && github.event.inputs.release != 'no' && github.event.inputs.release || 'patch' }}
      - name: ⚙️ Read package version
        id: version
        run: |
          version=$(python3 tasks/cargo_version.py Cargo.toml)
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: 🧹 Run pre-commit
        if: ${{ !inputs.release-build }}
        uses: tox-dev/action-pre-commit-uv@ae5b217f46f65d48b20a76b902d7950c745171af # v1.1.1
        continue-on-error: true
      - name: 🔍 Show changes
        if: ${{ !inputs.release-build }}
        run: git diff HEAD -u
      - name: 📤 Upload source
        id: source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simplint-source
          path: |
            .
            !.git
          compression-level: 9
          retention-days: 1
          if-no-files-found: "error"
  linux:
    name: 🏗️ ${{ matrix.platform.target }}
    needs: [bump]
    runs-on: ${{ matrix.platform.runner }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.bump.outputs.source-date-epoch }}
    strategy:
      fail-fast: false
      matrix:
        # `pgo` names the Rust target of release builds that get profile-guided optimization. Only targets the runner
        # executes natively qualify, since the instrumented binary must run the training workload on it; the zig and
        # riscv64 builds cross-compile.
        platform:
          - {runner: ubuntu-26.04, target: x86_64, manylinux: "2_28", pgo: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-26.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, pgo: x86_64-unknown-linux-musl}
          - {runner: ubuntu-26.04, target: aarch64, manylinux: "2_28", zig: true}
          - {runner: ubuntu-26.04, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, zig: true}
          - {runner: ubuntu-26.04, target: riscv64gc-unknown-linux-gnu, manylinux: "2_31"}
    steps:
      - name: 📩 Download source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bump.outputs.source-artifact-id }}
      # PGO runs only for release builds and the manual `pgo` checkbox of the build workflow, never for pull requests,
      # main or nightly builds: the instrumented build and the training add minutes to each job. A re-run of the same
      # build, after another platform failed say, restores the merged profile and skips both. The key names the exact
      # build the profile was recorded from and has no prefix fallback, because a profile from any other source,
      # toolchain, dependency set or corpus matches the binary only in part and silently makes it slower.
      - name: ⚙️ Read Rust toolchain channel
        id: toolchain
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >>"$GITHUB_OUTPUT"
      - name: 📦 Restore PGO profile
        id: profile
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pgo/simplint.profdata
          key: pgo-profile-${{ matrix.platform.pgo }}-${{ needs.bump.outputs.version }}-${{ github.sha }}-rust${{ steps.toolchain.outputs.channel }}-maturin${{ needs.bump.outputs.maturin-version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'tasks/pgo*') }}
      - name: 🐍 Set up Python
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          ignore-empty-workdir: true
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: "3.15"
      - name: 🦀 Install Rust toolchain
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: llvm-tools-preview
          cache: false
      # The instrumented build must match the final one in target and Cargo profile: a different profile setting, such
      # as a cheaper LTO, changes the crate hashes in symbol names, the profile matches nothing, and the binary ends up
      # 5-7% slower than one built without PGO.
      - name: 🏗️ Build instrumented binary
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo && steps.profile.outputs.cache-hit != 'true' }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.bump.outputs.maturin-version }}
          target: ${{ matrix.platform.target }}
          args: --locked --release --out target/pgo-wheels --target-dir target/pgo-build
          manylinux: ${{ matrix.platform.manylinux }}
          docker-options: --env SOURCE_DATE_EPOCH
          sccache: false
        env:
          RUSTFLAGS: -Cprofile-generate
      # The training checks every sdist against its pinned sha256, so the cache only saves the downloads and need not be
      # trusted. Its key follows the manifest, so the monthly refresh of tasks/pgo_corpus.toml starts a new cache.
      - name: 📦 Restore PGO corpus
        id: corpus
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo && steps.profile.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pgo-corpus
          key: pgo-corpus-${{ runner.os }}-${{ hashFiles('tasks/pgo_corpus.toml') }}
      - name: 🏋️ Collect PGO profile
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo && steps.profile.outputs.cache-hit != 'true' }}
        shell: bash
        # The profile lives outside target, which the Linux build container creates as root.
        run: python tasks/pgo.py train "target/pgo-build/$PGO_TARGET/release/simplint" pgo --cache pgo-corpus
        env:
          PGO_TARGET: ${{ matrix.platform.pgo }}
      # Saved right away rather than at the end of the job, so a later failing step does not lose them for the re-run.
      - name: 💾 Save PGO corpus
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo && steps.profile.outputs.cache-hit != 'true' && steps.corpus.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pgo-corpus
          key: ${{ steps.corpus.outputs.cache-primary-key }}
      - name: 💾 Save PGO profile
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo && steps.profile.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pgo/simplint.profdata
          key: ${{ steps.profile.outputs.cache-primary-key }}
      # The flag makes the build warn about each function the profile has no data for; it leaves the binary as is.
      - name: ⚙️ Use PGO profile
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        shell: bash
        run: |
          flags="-Cprofile-use=$GITHUB_WORKSPACE/pgo/simplint.profdata -Cllvm-args=-pgo-warn-missing-function"
          echo "RUSTFLAGS=$flags" >>"$GITHUB_ENV"
          echo "PGO_BUILD_LOG=$GITHUB_WORKSPACE/pgo/build.log" >>"$GITHUB_ENV"
      - name: 🏗️ Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.bump.outputs.maturin-version }}
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist --target-dir target ${{ matrix.platform.zig && '--zig' || '' }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          docker-options: --env SOURCE_DATE_EPOCH --env PGO_BUILD_LOG
          sccache: ${{ !inputs.release-build && !inputs.pgo }}
          # The container runs this in the shell that then calls maturin, so the function copies the build output of
          # PGO builds into the log the profile check reads; the workspace is mounted at the same path.
          before-script-linux: |
            if [[ -n "${PGO_BUILD_LOG:-}" ]]; then
              maturin() { command maturin "$@" 2>&1 | tee "$PGO_BUILD_LOG"; }
            fi
      # A profile from a build differing in any compiler flag or Cargo profile setting matches nothing, and the binary
      # silently loses the whole gain.
      - name: 🔍 Check the PGO profile matched
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        shell: bash
        run: python tasks/pgo.py verify pgo/build.log pgo/simplint.profdata
      - name: 📤 Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simplint-wheels-linux-${{ matrix.platform.target }}
          path: dist
  windows:
    name: 🏗️ ${{ matrix.platform.target }}
    needs: [bump]
    runs-on: ${{ matrix.platform.runner }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.bump.outputs.source-date-epoch }}
    strategy:
      fail-fast: false
      matrix:
        # `pgo` as for Linux on x64. On arm64 the profiler runtime writes raw profiles llvm-profdata rejects as
        # malformed ("symbol name is empty"), so that build goes without PGO.
        platform:
          - {runner: windows-2025, target: x64, python: "3.15", pgo: x86_64-pc-windows-msvc}
          - {runner: windows-11-arm, target: aarch64, python: "3.15"}
    steps:
      - name: 📩 Download source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bump.outputs.source-artifact-id }}
      - name: 🐍 Set up Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        env:
          UV_VENV_SEED: "true"
        with:
          ignore-empty-workdir: true
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: ${{ matrix.platform.python }}
      - name: ⚙️ Read Rust toolchain channel
        id: toolchain
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >>"$GITHUB_OUTPUT"
      - name: 📦 Restore PGO profile
        id: profile
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pgo/simplint.profdata
          key: pgo-profile-${{ matrix.platform.pgo }}-${{ needs.bump.outputs.version }}-${{ github.sha }}-rust${{ steps.toolchain.outputs.channel }}-maturin${{ needs.bump.outputs.maturin-version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'tasks/pgo*') }}
      - name: 🦀 Install Rust toolchain
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: llvm-tools-preview
          cache: false
      # The instrumented build must match the final one in target and Cargo profile: a different profile setting, such
      # as a cheaper LTO, changes the crate hashes in symbol names, the profile matches nothing, and the binary ends up
      # 5-7% slower than one built without PGO.
      - name: 🏗️ Build instrumented binary
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo && steps.profile.outputs.cache-hit != 'true' }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.bump.outputs.maturin-version }}
          target: ${{ matrix.platform.target }}
          args: --locked --release --out target/pgo-wheels --target-dir target/pgo-build
          sccache: false
        env:
          RUSTFLAGS: -Cprofile-generate
      - name: 📦 Restore PGO corpus
        id: corpus
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo && steps.profile.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pgo-corpus
          key: pgo-corpus-${{ runner.os }}-${{ hashFiles('tasks/pgo_corpus.toml') }}
      - name: 🏋️ Collect PGO profile
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo && steps.profile.outputs.cache-hit != 'true' }}
        shell: bash
        run: python tasks/pgo.py train "target/pgo-build/$PGO_TARGET/release/simplint" pgo --cache pgo-corpus
        env:
          PGO_TARGET: ${{ matrix.platform.pgo }}
      # Saved right away rather than at the end of the job, so a later failing step does not lose them for the re-run.
      - name: 💾 Save PGO corpus
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo && steps.profile.outputs.cache-hit != 'true' && steps.corpus.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pgo-corpus
          key: ${{ steps.corpus.outputs.cache-primary-key }}
      - name: 💾 Save PGO profile
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo && steps.profile.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pgo/simplint.profdata
          key: ${{ steps.profile.outputs.cache-primary-key }}
      # The flag makes the build warn about each function the profile has no data for; it leaves the binary as is.
      - name: ⚙️ Use PGO profile
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        shell: bash
        run: |
          flags="-Cprofile-use=$GITHUB_WORKSPACE/pgo/simplint.profdata -Cllvm-args=-pgo-warn-missing-function"
          echo "RUSTFLAGS=$flags" >>"$GITHUB_ENV"
      - name: 🏗️ Build wheels
        if: ${{ !((inputs.release-build || inputs.pgo) && matrix.platform.pgo) }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.bump.outputs.maturin-version }}
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist --target-dir target
          # The action installs sccache from PyPI, whose newest release predates the fix for MSVC's `-Tp <file>`
          # (mozilla/sccache#2904), so wrapping cl.exe breaks building mimalloc's C++ source.
          sccache: false
      # The action keeps no copy of the build output, which the profile check reads, so PGO builds call maturin here.
      - name: 🏗️ Build wheels with PGO
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        shell: bash
        run: |
          uvx --from "maturin==${MATURIN_VERSION#v}" maturin build --locked --release --out dist --target-dir target \
            --target "$PGO_TARGET" 2>&1 | tee pgo/build.log
        env:
          MATURIN_VERSION: ${{ needs.bump.outputs.maturin-version }}
          PGO_TARGET: ${{ matrix.platform.pgo }}
      # A profile from a build differing in any compiler flag or Cargo profile setting matches nothing, and the binary
      # silently loses the whole gain.
      - name: 🔍 Check the PGO profile matched
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        shell: bash
        run: python tasks/pgo.py verify pgo/build.log pgo/simplint.profdata
      - name: 📤 Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simplint-wheels-windows-${{ matrix.platform.target }}
          path: dist
  macos:
    name: 🏗️ ${{ matrix.platform.target }}
    needs: [bump]
    runs-on: ${{ matrix.platform.runner }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.bump.outputs.source-date-epoch }}
    strategy:
      fail-fast: false
      matrix:
        # `pgo` as for Linux: the arm64 runner cross-compiles the x86_64 build.
        platform:
          - {runner: macos-26, target: x86_64}
          - {runner: macos-26, target: aarch64, pgo: aarch64-apple-darwin}
    steps:
      - name: 📩 Download source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bump.outputs.source-artifact-id }}
      - name: ⚙️ Read Rust toolchain channel
        id: toolchain
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >>"$GITHUB_OUTPUT"
      - name: 📦 Restore PGO profile
        id: profile
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pgo/simplint.profdata
          key: pgo-profile-${{ matrix.platform.pgo }}-${{ needs.bump.outputs.version }}-${{ github.sha }}-rust${{ steps.toolchain.outputs.channel }}-maturin${{ needs.bump.outputs.maturin-version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'tasks/pgo*') }}
      - name: 🐍 Set up Python
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          ignore-empty-workdir: true
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: "3.15"
      - name: 🦀 Install Rust toolchain
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: llvm-tools-preview
          cache: false
      # The instrumented build must match the final one in target and Cargo profile: a different profile setting, such
      # as a cheaper LTO, changes the crate hashes in symbol names, the profile matches nothing, and the binary ends up
      # 5-7% slower than one built without PGO.
      - name: 🏗️ Build instrumented binary
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo && steps.profile.outputs.cache-hit != 'true' }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.bump.outputs.maturin-version }}
          target: ${{ matrix.platform.target }}
          args: --locked --release --out target/pgo-wheels --target-dir target/pgo-build
          sccache: false
        env:
          RUSTFLAGS: -Cprofile-generate
      - name: 📦 Restore PGO corpus
        id: corpus
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo && steps.profile.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pgo-corpus
          key: pgo-corpus-${{ runner.os }}-${{ hashFiles('tasks/pgo_corpus.toml') }}
      - name: 🏋️ Collect PGO profile
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo && steps.profile.outputs.cache-hit != 'true' }}
        shell: bash
        run: python tasks/pgo.py train "target/pgo-build/$PGO_TARGET/release/simplint" pgo --cache pgo-corpus
        env:
          PGO_TARGET: ${{ matrix.platform.pgo }}
      # Saved right away rather than at the end of the job, so a later failing step does not lose them for the re-run.
      - name: 💾 Save PGO corpus
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo && steps.profile.outputs.cache-hit != 'true' && steps.corpus.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pgo-corpus
          key: ${{ steps.corpus.outputs.cache-primary-key }}
      - name: 💾 Save PGO profile
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo && steps.profile.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pgo/simplint.profdata
          key: ${{ steps.profile.outputs.cache-primary-key }}
      # The flag makes the build warn about each function the profile has no data for; it leaves the binary as is.
      - name: ⚙️ Use PGO profile
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        shell: bash
        run: |
          flags="-Cprofile-use=$GITHUB_WORKSPACE/pgo/simplint.profdata -Cllvm-args=-pgo-warn-missing-function"
          echo "RUSTFLAGS=$flags" >>"$GITHUB_ENV"
      - name: 🏗️ Build wheels
        if: ${{ !((inputs.release-build || inputs.pgo) && matrix.platform.pgo) }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.bump.outputs.maturin-version }}
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist --target-dir target
          sccache: ${{ !inputs.release-build && !inputs.pgo }}
      # The action keeps no copy of the build output, which the profile check reads, so PGO builds call maturin here.
      - name: 🏗️ Build wheels with PGO
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        shell: bash
        run: |
          uvx --from "maturin==${MATURIN_VERSION#v}" maturin build --locked --release --out dist --target-dir target \
            --target "$PGO_TARGET" 2>&1 | tee pgo/build.log
        env:
          MATURIN_VERSION: ${{ needs.bump.outputs.maturin-version }}
          PGO_TARGET: ${{ matrix.platform.pgo }}
      # A profile from a build differing in any compiler flag or Cargo profile setting matches nothing, and the binary
      # silently loses the whole gain.
      - name: 🔍 Check the PGO profile matched
        if: ${{ (inputs.release-build || inputs.pgo) && matrix.platform.pgo }}
        shell: bash
        run: python tasks/pgo.py verify pgo/build.log pgo/simplint.profdata
      - name: 📤 Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simplint-wheels-macos-${{ matrix.platform.target }}
          path: dist
  sdist:
    name: 🏗️ sdist
    needs: [bump]
    runs-on: ubuntu-26.04
    env:
      SOURCE_DATE_EPOCH: ${{ needs.bump.outputs.source-date-epoch }}
    steps:
      - name: 📩 Download source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.bump.outputs.source-artifact-id }}
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          ignore-empty-workdir: true
          version: latest-known
          python-version: "3.15"
      - name: 📦 Export locked build constraints
        id: constraints
        uses: tox-dev/github-workflows/export-build-constraints@57a765127aae73adf7d0e24a7fe0f067f2d3ea3e # 6.2.1
      - name: 🏗️ Build sdist
        run: uv build --build-constraints "$BUILD_CONSTRAINTS" --sdist --out-dir dist .
        shell: bash
        env:
          BUILD_CONSTRAINTS: ${{ steps.constraints.outputs.path }}
          UV_REQUIRE_BUILD_HASHES: "true"
      - name: 📤 Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simplint-wheels-sdist
          path: dist
  all-pass:
    name: 🚦 build
    if: always()
    needs: [bump, linux, windows, macos, sdist]
    runs-on: ubuntu-26.04
    steps:
      - name: 🚦 Decide whether all jobs passed or were skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Some jobs failed or were canceled"
            exit 1
          fi
          echo "All jobs passed or were skipped"
