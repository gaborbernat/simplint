name: 🔀 update dependencies
on:
  workflow_dispatch:
    inputs:
      cooldown:
        description: Upload age a bumped release needs, such as 7 days; 0 days turns the cooldown off
        type: string
        default: 7 days
      expedite:
        description: Space-separated packages whose newest release skips the cooldown for this run
        type: string
        default: ""
  schedule:
    - cron: "0 8 * * 2"
permissions: {}
jobs:
  python:
    name: 📦 Bump Python dependencies
    uses: tox-dev/github-workflows/.github/workflows/update-python-dependencies.yaml@13381289334b15375958be7f7438f3c3d860e575 # 6.5.5
    permissions:
      contents: read
    with:
      files: |
        pyproject.toml tox.toml
      kind: library
      cooldown: ${{ inputs.cooldown || '7 days' }}
      expedite: ${{ inputs.expedite || '' }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
  release-tools:
    name: 🔀 Upgrade release tools
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@13381289334b15375958be7f7438f3c3d860e575 # 6.5.5
    permissions:
      contents: read
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
