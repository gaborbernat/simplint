name: 🔀 python versions
on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * *"
permissions: {}
jobs:
  bump:
    name: 📦 Update supported Python versions
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
      - name: ⚙️ Update the Python requirement and classifiers
        run: uv run tasks/python_versions.py
      # Hooks can reformat the generated changes. Retry once to check the formatted files.
      - name: 🧹 Run prek
        run: uvx prek run --all-files || uvx prek run --all-files
      - name: 📝 Save the changes
        id: diff
        run: |
          git diff HEAD --binary >"$RUNNER_TEMP/maintenance.patch"
          if [ -s "$RUNNER_TEMP/maintenance.patch" ]; then echo "changed=true"; else echo "changed=false"; fi >>"$GITHUB_OUTPUT"
      - name: 📤 Upload maintenance patch
        id: upload
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: maintenance-patch
          path: ${{ runner.temp }}/maintenance.patch
          if-no-files-found: error
  bump-pr:
    name: 🔀 Open Python versions PR
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    uses: tox-dev/github-workflows/.github/workflows/open-maintenance-pr.yaml@b34c57a8a06e7b043c2ddd0b6b7a8a778d7aa8f7 # 6.8.5
    with:
      artifact-id: ${{ needs.bump.outputs.artifact-id }}
      allowed-paths: pyproject.toml
      branch: update-python-versions
      title: Update the supported Python versions
      body: Update the package's minimum Python version and its PyPI classifiers using the release and end-of-life data.
      labels: skip news
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
