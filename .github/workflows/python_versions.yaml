name: 🔀 python versions
on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * *"
permissions: {}
jobs:
  bump:
    name: 📦 Bump default Python versions
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
      - name: ⚙️ Update the default Python versions
        run: uv run tasks/python_versions.py
      # The first pass applies formatting hooks (mdformat rewrites the generated file), which fails it; the second
      # verifies the formatted output, so the saved patch carries the formatting.
      - name: 🧹 Run prek
        run: uvx prek run --all-files || uvx prek run --all-files
      # A run with nothing new opens no PR; the shared workflow rejects an empty patch.
      - name: 📝 Save the changes
        id: diff
        run: |
          git diff HEAD --binary >"$RUNNER_TEMP/maintenance.patch"
          if [ -s "$RUNNER_TEMP/maintenance.patch" ]; then echo "changed=true"; else echo "changed=false"; fi >>"$GITHUB_OUTPUT"
      - name: 📤 Upload maintenance patch
        id: upload
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: maintenance-patch
          path: ${{ runner.temp }}/maintenance.patch
          if-no-files-found: error
  bump-pr:
    name: 🔀 Open Python versions PR
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    uses: tox-dev/github-workflows/.github/workflows/open-maintenance-pr.yaml@81a3fc661be49ecdc4ea4af99a69fa3879b3d7a1 # 6.8.1
    with:
      artifact-id: ${{ needs.bump.outputs.artifact-id }}
      allowed-paths: pyproject.toml
      branch: update-python-versions
      title: Set the Python releases the defaults name
      body: Keep the default supported Python range aligned with published classifiers, release candidates, and supported cycles.
      labels: skip news
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
