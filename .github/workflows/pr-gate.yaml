name: 🚦 PR gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # The merge queue checks each pull request on top of the ones ahead of it before merging.
  merge_group:
permissions: {}
concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: 🏗️ build
    uses: $/.github/workflows/build.yaml
    permissions:
      contents: read
      pull-requests: read
  test:
    name: 🧪 test
    uses: $/.github/workflows/test.yaml
    permissions:
      contents: read
  release:
    name: 🏷️ Release dry run
    uses: $/.github/workflows/prepare-release.yaml
    permissions:
      contents: read
      pull-requests: read
    with:
      dry-run: true
  gate:
    name: 🚦 Required checks pass
    if: always()
    needs: [build, test, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: 🚦 Require all needed jobs to pass
        uses: tox-dev/github-workflows/required-checks@13381289334b15375958be7f7438f3c3d860e575 # 6.5.5
        with:
          needs: ${{ toJSON(needs) }}
