name: 🚦 PR gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tasks:
    name: 🧪 Maintenance tasks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: '3.15'
          enable-cache: false
      - name: 📦 Install current test tools
        run: |
          uv venv --python 3.15 .venv
          uv pip install --python .venv/bin/python --group pyproject.toml:test --group pyproject.toml:docs
      - name: 🧪 Test maintenance tasks
        env:
          PYTHONPATH: .:tasks
        run: .venv/bin/python -m pytest -q tests/tasks
  build:
    name: 🏗️ build
    uses: $/.github/workflows/build.yaml
    permissions:
      contents: read
      pull-requests: read
  test:
    name: 🧪 test
    uses: $/.github/workflows/test.yaml
    permissions:
      contents: read
  gate:
    name: 🚦 Required checks pass
    if: always()
    needs: [tasks, build, test]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: 🚦 Require all needed jobs to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(to_entries[]; .value.result == "success")' <<<"$NEEDS_JSON"
