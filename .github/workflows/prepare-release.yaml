name: 🏷️ Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        type: choice
        options: [auto, major, minor, patch]
        default: auto
permissions: {}
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  prepare:
    name: 🏷️ Prepare release
    if: github.repository == 'gaborbernat/simplint'
    uses: tox-dev/github-workflows/.github/workflows/prepare-release-creator.yaml@13381289334b15375958be7f7438f3c3d860e575 # 6.5.5
    permissions:
      contents: read
      pull-requests: read
    with:
      bump: ${{ inputs.bump }}
      tag-format: "{version}"
      annotated: true
      cargo-set-version: true
      assemble-command: python3 tasks/assemble_release.py "$VERSION"
      release-paths: |
        CHANGELOG.md
        Cargo.lock
        Cargo.toml
        changelog.d/*.md
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
