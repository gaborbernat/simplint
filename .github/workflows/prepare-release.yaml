name: 🏷️ Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        type: choice
        options: [auto, major, minor, patch]
        default: auto
  workflow_call:
    inputs:
      dry-run:
        description: Assemble the release without pushing, for the pull request gate
        type: boolean
        required: true
permissions: {}
concurrency:
  group: prepare-release${{ inputs.dry-run && format('-dry-run-{0}', github.ref) || '' }}
  cancel-in-progress: false
jobs:
  prepare:
    name: 🏷️ Prepare release
    if: github.repository == 'gaborbernat/simplint'
    uses: tox-dev/github-workflows/.github/workflows/prepare-release-creator.yaml@2a3b863f4563ce9891d2cee1ed381b6f82654836 # 6.6.0
    permissions:
      contents: read
      pull-requests: read
    with:
      bump: ${{ inputs.bump || 'auto' }}
      dry-run: ${{ inputs.dry-run == true }}
      tag-format: "{version}"
      annotated: true
      cargo-set-version: true
      assemble-command: python3 tasks/assemble_release.py "$VERSION"
      release-paths: |
        CHANGELOG.md
        Cargo.lock
        Cargo.toml
        changelog.d/*.md
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
