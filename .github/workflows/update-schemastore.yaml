name: 🔀 Update SchemaStore
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose schema to submit
        required: true
        type: string
  pull_request:
    paths:
      - "simplint.schema.json"
      - "tasks/register_schemastore.py"
      - "tasks/schemastore_options.json"
      - ".github/workflows/update-schemastore.yaml"
permissions:
  contents: read
jobs:
  stage:
    # SchemaStore's npm dependencies, formatter and checks run here, in a job that holds no secret, so none of that code
    # can read the token the pull request needs. The job hands its result to the next one as a patch.
    name: 🔍 Stage the schema for SchemaStore
    runs-on: ubuntu-26.04
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📥 Clone SchemaStore
        run: git clone --depth 1 https://github.com/SchemaStore/schemastore "$RUNNER_TEMP/schemastore"
      - name: 📦 Install SchemaStore's dependencies
        run: npm ci
        working-directory: ${{ runner.temp }}/schemastore
      - name: ⚙️ Register or update simplint's schema
        # A first run adds the partial and its references; once SchemaStore has them, only the partial changes.
        run: uv run --no-project --python 3.15 python tasks/register_schemastore.py "$SCHEMA" "$STORE" tasks/schemastore_options.json
        env:
          SCHEMA: ${{ github.workspace }}/simplint.schema.json
          STORE: ${{ runner.temp }}/schemastore
      - name: ✨ Format the staged files like SchemaStore does
        run: npx prettier --config .prettierrc.cjs --write src/schemas/json/partial-simplint.json src/schemas/json/pyproject.json src/schema-validation.jsonc src/test/partial-simplint/options.json
        working-directory: ${{ runner.temp }}/schemastore
      - name: 🔍 Run SchemaStore's checks against it
        run: |
          node ./cli.js check --schema-name=partial-simplint.json
          node ./cli.js check --schema-name=pyproject.json
        working-directory: ${{ runner.temp }}/schemastore
      - name: 📝 Write the patch
        id: patch
        run: |
          git add --all
          git diff --cached --binary > "$RUNNER_TEMP/simplint-schema.patch"
          if [ -s "$RUNNER_TEMP/simplint-schema.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: ${{ runner.temp }}/schemastore
      - name: 📤 Upload the patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simplint-schema-patch
          path: ${{ runner.temp }}/simplint-schema.patch
          retention-days: 1
  update-schemastore:
    name: 🔀 Open SchemaStore PR
    needs: stage
    if: github.event_name != 'pull_request' && needs.stage.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    environment: schemastore
    env:
      BRANCH: update-simplint-schema
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: 📥 Download the patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: simplint-schema-patch
          path: ${{ runner.temp }}
      - name: 📥 Fork and clone SchemaStore
        run: |
          gh repo fork SchemaStore/schemastore --clone=false
          FORK="$(gh api user --jq .login)/schemastore"
          gh repo sync "$FORK" -b master
          gh repo clone "$FORK" "$RUNNER_TEMP/schemastore" -- --depth 1 --branch master
        env:
          GH_TOKEN: ${{ secrets.SCHEMASTORE_TOKEN }}
      - name: ⚙️ Apply the patch
        id: apply
        run: |
          if [ -f src/schemas/json/partial-simplint.json ]; then
            echo "registered=true" >> "$GITHUB_OUTPUT"
          else
            echo "registered=false" >> "$GITHUB_OUTPUT"
          fi
          git switch -C "$BRANCH"
          git apply --3way --index "$RUNNER_TEMP/simplint-schema.patch"
        working-directory: ${{ runner.temp }}/schemastore
      - name: ⬆️ Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$REGISTERED" = true ]; then
            git commit -m "Update simplint JSON Schema to $TAG"
          else
            git commit --file - <<'EOF'
          Add simplint partial schema for pyproject.toml

          simplint reads its settings from the [tool.simplint] table of
          pyproject.toml. Its JSON Schema is published as partial-simplint.json,
          which pyproject.json references from its tool table, so editors that
          use SchemaStore check the table without a catalog entry of its own.
          The release workflow updates the partial on later releases.
          EOF
          fi
          gh auth setup-git
          git push --force origin "$BRANCH"
        working-directory: ${{ runner.temp }}/schemastore
        env:
          GH_TOKEN: ${{ secrets.SCHEMASTORE_TOKEN }}
          REGISTERED: ${{ steps.apply.outputs.registered }}
      - name: 🔀 Create or update the pull request
        run: |
          HEAD="$(gh api user --jq .login):$BRANCH"
          SOURCE="[$TAG](https://github.com/gaborbernat/simplint/tree/$TAG)"
          if [ "$REGISTERED" = true ]; then
            TITLE="Update simplint JSON Schema to $TAG"
            BODY="Updates simplint's JSON Schema to release $SOURCE."
          else
            TITLE="Add simplint schema for [tool.simplint]"
            BODY="Registers simplint's JSON Schema as \`partial-simplint.json\`, referenced from the \`tool\` table of \`pyproject.json\`, from release $SOURCE. Later releases update the partial."
          fi
          if gh pr view "$HEAD" --repo SchemaStore/schemastore > /dev/null 2>&1; then
            gh pr edit "$HEAD" --repo SchemaStore/schemastore --title "$TITLE" --body "$BODY"
          else
            gh pr create --repo SchemaStore/schemastore --head "$HEAD" --title "$TITLE" --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.SCHEMASTORE_TOKEN }}
          REGISTERED: ${{ steps.apply.outputs.registered }}
