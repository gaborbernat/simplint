name: 🏗️ cross-compile
on:
  # Pushes to main save the Rust cache that pull requests restore.
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "pyproject.toml"
      - ".github/workflows/cross-compile.yaml"
  workflow_call:
concurrency:
  group: cross-compile-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
# Pull requests and the merge queue only prove each target compiles and links, which this does without LTO; the
# optimized wheels build in the build workflow, where they ship or guard a release.
jobs:
  changes:
    name: 🧭 Detect changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.run == 'true' }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🧭 Detect changed paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            run:
              - 'src/**'
              - 'tests/**'
              - 'docs/**'
              - 'tasks/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'pyproject.toml'
              - 'tox.toml'
              - '.github/workflows/cross-compile.yaml'
  targets:
    name: 🏗️ cross-compile
    needs: [changes, maturin]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-26.04, target: aarch64-unknown-linux-gnu, manylinux: "2_28", args: --zig}
          - {os: ubuntu-26.04, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, args: --zig}
          - {os: ubuntu-26.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, args: --zig}
          # zig cannot link riscv64 against glibc, so this target builds in maturin's cross container, whose root-owned
          # target directory the cache cannot clean.
          - {os: ubuntu-26.04, target: riscv64gc-unknown-linux-gnu, manylinux: "2_31", docker: true}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc}
          - {os: macos-26, target: x86_64-apple-darwin}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          target: ${{ matrix.target }}
          cache: ${{ !matrix.docker }}
          cache-key: ${{ matrix.target }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 🏗️ Build the wheel without optimizations
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: ${{ needs.maturin.outputs.version }}
          target: ${{ matrix.target }}
          args: --locked --profile dev --out dist --target-dir target ${{ matrix.args }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          sccache: false
  maturin:
    name: ⚙️ Read locked maturin version
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.maturin.outputs.version }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Set up Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          enable-cache: false
          python-version: "3.15"
      - name: 📦 Install locked build tool
        uses: tox-dev/github-workflows/install-locked-tools@6.8.2
        with:
          groups: release-build
          venv: ${{ runner.temp }}/release-tools
      - name: ⚙️ Read locked maturin version
        id: maturin
        shell: bash
        run: |
          version=$("$RUNNER_TEMP/release-tools/bin/maturin" --version)
          printf 'version=v%s\n' "${version#maturin }" >>"$GITHUB_OUTPUT"
