name: 📝 Changelog
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  merge_group:
permissions:
  contents: read
jobs:
  news:
    name: 📝 News fragment
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # `gh pr create --label` labels the PR right after opening it, which fires `labeled` beside `opened`; the run for
      # `opened` reads the labels as they are when it checks, so the run for that label has nothing to add. A merge
      # queue run has no pull request to read, and the pull request passed this check before it was queued.
      - name: 🧭 Skip labels added at opening and merge queue runs
        id: gate
        if: github.event_name == 'merge_group' || github.event.action == 'labeled' || github.event.action == 'unlabeled'
        env:
          CREATED: ${{ github.event.pull_request.created_at }}
          UPDATED: ${{ github.event.pull_request.updated_at }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == merge_group ]]; then
            echo 'skip=true' >>"$GITHUB_OUTPUT"
          elif (($(date -d "$UPDATED" +%s) - $(date -d "$CREATED" +%s) < 60)); then
            echo 'skip=true' >>"$GITHUB_OUTPUT"
          fi
      - name: 📥 Check out code
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🧭 List changed paths
        if: steps.gate.outputs.skip != 'true'
        run: git diff --diff-filter=AM --name-only "origin/$GITHUB_BASE_REF"...HEAD >"$RUNNER_TEMP/changed-paths"
      - name: 🧭 Detect release lock changes
        if: steps.gate.outputs.skip != 'true'
        id: release-lock
        run: |
          changed=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" -- pyproject.toml pylock.toml nab.toml)
          if [[ -n "$changed" ]]; then
            echo 'changed=true' >>"$GITHUB_OUTPUT"
          else
            echo 'changed=false' >>"$GITHUB_OUTPUT"
          fi
      - name: 🧭 Detect changelog changes
        if: steps.gate.outputs.skip != 'true'
        id: changelog
        run: |
          if [[ -n $(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" -- changelog.d) ]]; then
            echo 'changed=true' >>"$GITHUB_OUTPUT"
          else
            echo 'changed=false' >>"$GITHUB_OUTPUT"
          fi
      - name: 🔍 Validate fragments
        if: steps.gate.outputs.skip != 'true'
        id: fragments
        run: |
          set -euo pipefail
          found_any=false
          while IFS= read -r path; do
            [[ "$path" == changelog.d/*.md ]] || continue
            found_any=true
            name=${path##*/}
            category=${name%.md}
            category=${category##*.}
            case "$category" in
            feature | change | bugfix | doc | breaking | security | performance | deprecation | removal | packaging) ;;
            *)
              echo "::error::unknown changelog category: $path"
              exit 1
              ;;
            esac
            stem=${name%.*.*}
            if ! { [[ "$stem" == +?* && "${stem#+}" != *[!a-zA-Z0-9-]* ]] ||
              [[ -n "$stem" && "$stem" != *[!0-9]* ]]; } ||
              [[ -z $(tr -d '[:space:]' <"$path") ]]; then
              echo "::error::invalid or empty changelog fragment: $path"
              exit 1
            fi
          done <"$RUNNER_TEMP/changed-paths"
          echo "any=$found_any" >>"$GITHUB_OUTPUT"
      - name: 🔍 Require a fragment
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BOT_AUTHOR: ${{ github.event.pull_request.user.type == 'Bot' }}
          FOUND_ANY: ${{ steps.fragments.outputs.any }}
        run: |
          # The event's labels are those at opening; a label added a moment later must count too.
          skip_news=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "skip news")')
          if [[ "$skip_news" == true || "$BOT_AUTHOR" == true || "$FOUND_ANY" == true ]]; then
            exit 0
          fi
          echo '::error::add a changelog.d fragment or apply skip news'
          exit 1
      - name: 🐍 Install uv
        if: steps.gate.outputs.skip != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: '3.15'
          enable-cache: false
      - name: 🔒 Check the release lock
        if: steps.gate.outputs.skip != 'true' && steps.release-lock.outputs.changed == 'true'
        uses: tox-dev/github-workflows/refresh-release-lock@13381289334b15375958be7f7438f3c3d860e575 # 6.5.5
        with:
          mode: check
      - name: 🔍 Check assembled news
        if: steps.gate.outputs.skip != 'true' && steps.changelog.outputs.changed == 'true'
        run: |
          set -euo pipefail
          root=$(mktemp -d -p "$RUNNER_TEMP")
          cp -r CHANGELOG.md changelog.d "$root"
          uv run --no-project --python 3.15 python tasks/assemble_release.py 0.0.0 --root "$root"
