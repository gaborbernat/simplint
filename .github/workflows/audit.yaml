name: 🛡️ audit
on:
  workflow_dispatch:
  pull_request:
    paths: [Cargo.lock, Cargo.toml, deny.toml]
  push:
    branches: ["main"]
  schedule:
    - cron: "45 7 * * 1"
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  advisories:
    name: 🛡️ RustSec advisories
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 🔍 Check advisories
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check advisories
