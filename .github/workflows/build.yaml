name: 🏗️ build
on:
  workflow_dispatch:
    inputs:
      pgo:
        description: Build the wheels with profile-guided optimization, as a release does
        type: boolean
        default: false
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions: {}
jobs:
  maturin:
    name: ⚙️ Read locked maturin version
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.maturin.outputs.version }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Set up Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          enable-cache: false
          python-version: "3.15"
      - name: 📦 Install locked build tool
        uses: tox-dev/github-workflows/install-locked-tools@6.8.5
        with:
          groups: release-build
          venv: ${{ runner.temp }}/release-tools
      - name: ⚙️ Read locked maturin version
        id: maturin
        shell: bash
        run: |
          version=$("$RUNNER_TEMP/release-tools/bin/maturin" --version)
          printf 'version=v%s\n' "${version#maturin }" >>"$GITHUB_OUTPUT"
  pgo:
    name: 🏗️ PGO wheels
    needs: maturin
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.pgo) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {runner: ubuntu-26.04-arm, target: aarch64, manylinux: "2_28", pgo: aarch64-unknown-linux-gnu}
          - {runner: ubuntu-26.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, pgo: aarch64-unknown-linux-musl}
          - {runner: ubuntu-26.04, target: riscv64gc-unknown-linux-gnu, manylinux: "2_31", pgo: riscv64gc-unknown-linux-gnu}
          - {runner: macos-26-intel, target: x86_64, pgo: x86_64-apple-darwin}
          - {runner: windows-11-arm, target: aarch64, pgo: aarch64-pc-windows-msvc}
          - {runner: ubuntu-26.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, pgo: x86_64-unknown-linux-musl, layout: true}
          - {runner: windows-2025, target: x64, pgo: x86_64-pc-windows-msvc, layout: true}
          - {runner: macos-26, target: aarch64, pgo: aarch64-apple-darwin, layout: true}
    env:
      PGO_TARGET: ${{ matrix.platform.pgo }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ⚙️ Read source timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"
      - name: 🐍 Set up Python
        uses: astral-sh/setup-uv@v10.3.3
        env:
          UV_VENV_SEED: "true"
        with:
          ignore-empty-workdir: true
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: "3.15"
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: llvm-tools-preview
          cache: false
      - name: 🏗️ Build instrumented binary
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: ${{ needs.maturin.outputs.version }}
          target: ${{ matrix.platform.target }}
          args: --locked --release --out target/pgo-wheels --target-dir target/pgo-build
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          docker-options: --env SOURCE_DATE_EPOCH
          sccache: false
        env:
          RUSTFLAGS: -Cprofile-generate
      - name: Run RISC-V binaries under QEMU
        if: matrix.platform.pgo == 'riscv64gc-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-binfmt libc6-riscv64-cross libgcc-s1-riscv64-cross
          echo 'QEMU_LD_PREFIX=/usr/riscv64-linux-gnu' >>"$GITHUB_ENV"
          cat /proc/sys/fs/binfmt_misc/qemu-riscv64
      - name: 🏋️ Collect PGO profile
        shell: bash
        # The profile lives outside target, which the Linux build container creates as root.
        run: python -m tasks.pgo train "target/pgo-build/$PGO_TARGET/release/simplint" pgo --cache pgo-corpus
      - name: ⚙️ Use PGO profile
        shell: bash
        run: |
          flags="-Cprofile-use=$GITHUB_WORKSPACE/pgo/simplint.profdata -Cllvm-args=-pgo-warn-missing-function"
          echo "RUSTFLAGS=$flags" >>"$GITHUB_ENV"
          echo "PGO_BUILD_LOG=$GITHUB_WORKSPACE/pgo/build.log" >>"$GITHUB_ENV"
      - name: Select control flags
        if: ${{ !matrix.platform.layout }}
        shell: bash
        run: echo 'RUSTFLAGS=' >>"$GITHUB_ENV"
      - name: 🏗️ Build wheels
        if: ${{ startsWith(matrix.platform.runner, 'ubuntu') }}
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: ${{ needs.maturin.outputs.version }}
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist --target-dir target
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          docker-options: --env SOURCE_DATE_EPOCH --env PGO_BUILD_LOG
          sccache: false
          before-script-linux: |
            if [[ -n "${PGO_BUILD_LOG:-}" ]]; then
              maturin() { command maturin "$@" 2>&1 | tee "$PGO_BUILD_LOG"; }
            fi
      - name: 🏗️ Build wheels with PGO
        if: ${{ !startsWith(matrix.platform.runner, 'ubuntu') }}
        shell: bash
        run: |
          uvx --from "maturin==${MATURIN_VERSION#v}" maturin build --locked --release --out dist --target-dir target \
            --target "$PGO_TARGET" 2>&1 | tee pgo/build.log
        env:
          MATURIN_VERSION: ${{ needs.maturin.outputs.version }}
      - name: Keep the control wheel
        shell: bash
        run: mv dist control
      - name: ⚙️ Use PGO profile
        shell: bash
        env:
          LAYOUT: ${{ matrix.platform.layout || false }}
        run: |
          flags="-Cprofile-use=$GITHUB_WORKSPACE/pgo/simplint.profdata -Cllvm-args=-pgo-warn-missing-function"
          if [[ "$LAYOUT" == true ]]; then flags="$flags -Cllvm-args=-enable-ext-tsp-block-placement"; fi
          echo "RUSTFLAGS=$flags" >>"$GITHUB_ENV"
          echo "PGO_BUILD_LOG=$GITHUB_WORKSPACE/pgo/build.log" >>"$GITHUB_ENV"
      - name: 🏗️ Build wheels
        if: ${{ startsWith(matrix.platform.runner, 'ubuntu') }}
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: ${{ needs.maturin.outputs.version }}
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist --target-dir target
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          docker-options: --env SOURCE_DATE_EPOCH --env PGO_BUILD_LOG
          sccache: false
          before-script-linux: |
            if [[ -n "${PGO_BUILD_LOG:-}" ]]; then
              maturin() { command maturin "$@" 2>&1 | tee "$PGO_BUILD_LOG"; }
            fi
      - name: 🏗️ Build wheels with PGO
        if: ${{ !startsWith(matrix.platform.runner, 'ubuntu') }}
        shell: bash
        run: |
          uvx --from "maturin==${MATURIN_VERSION#v}" maturin build --locked --release --out dist --target-dir target \
            --target "$PGO_TARGET" 2>&1 | tee pgo/build.log
        env:
          MATURIN_VERSION: ${{ needs.maturin.outputs.version }}
      - name: 🔍 Check the PGO profile matched
        shell: bash
        run: python -m tasks.pgo verify pgo/build.log pgo/simplint.profdata
      - name: Compare release wheels
        shell: bash
        run: python -m tasks.wheel_trial
      - name: Upload measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: measurements-${{ matrix.platform.pgo }}
          path: |
            measurements.csv
            totals.txt
            control/*.whl
            dist/*.whl
          if-no-files-found: warn
