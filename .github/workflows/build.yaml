name: Compare ARM64 function ordering
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  measure:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: "3.15"
      - name: Order functions from the same profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44687157321 --name arm64-layout-inputs --dir inputs
          sudo apt-get update -qq
          sudo apt-get install -y bolt-22 python3-wheel
          /usr/bin/python3 -m wheel unpack --dest "$RUNNER_TEMP/wheel" inputs/unoptimized-wheels/*.whl
          binary=("$RUNNER_TEMP"/wheel/*/*.data/scripts/simplint)
          cp "${binary[0]}" "$RUNNER_TEMP/original"
          for variant in control dist; do
            order=cdsort
            if [[ "$variant" == dist ]]; then order=hfsort; fi
            llvm-bolt-22 "$RUNNER_TEMP/original" -data=inputs/profile -reorder-blocks=ext-tsp -reorder-functions="$order" \
              -split-functions -split-all-cold -o "$RUNNER_TEMP/optimized"
            strip --strip-all --remove-section=.note.bolt_info -o "${binary[0]}" "$RUNNER_TEMP/optimized"
            chmod +x "${binary[0]}"
            "${binary[0]}" --version
            mkdir -p "$variant"
            /usr/bin/python3 -m wheel pack --dest-dir "$variant" "$RUNNER_TEMP"/wheel/*
          done
      - name: Compare cold checks
        run: python -m tasks.wheel_trial
      - name: Upload timings and wheels
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: measurements-aarch64-unknown-linux-gnu
          path: |
            measurements.csv
            totals.txt
            control/*.whl
            dist/*.whl
          if-no-files-found: warn
