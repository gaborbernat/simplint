name: Check RISC-V release wheel
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Run with the RISC-V release wheel
        type: string
        required: true
      control:
        description: Run with the shipping Linux wheel
        type: string
        required: true
permissions: {}
jobs:
  compare:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
          activate-environment: true
          python-version: "3.15"
      - name: Download the release wheels
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.candidate }}
          CONTROL: ${{ inputs.control }}
        run: |
          gh run download "$CANDIDATE" --name simplint-wheels-linux-riscv64gc --dir dist
          gh run download "$CONTROL" --name simplint-wheels-pgo-x86_64-unknown-linux-gnu --dir control
      - name: Run RISC-V binaries under QEMU
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-binfmt libc6-riscv64-cross libgcc-s1-riscv64-cross libatomic1-riscv64-cross
          echo 'QEMU_LD_PREFIX=/usr/riscv64-linux-gnu' >>"$GITHUB_ENV"
          cat /proc/sys/fs/binfmt_misc/qemu-riscv64
      - name: Compare all diagnostics and fixes
        run: python -m tasks.wheel_trial
      - name: Upload correctness results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: correctness-riscv64
          path: correctness.csv
          if-no-files-found: warn
