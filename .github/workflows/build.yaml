name: 🏗️ build
on:
  workflow_dispatch:
    inputs:
      pgo:
        description: Build the wheels with profile-guided optimization, as a release does
        type: boolean
        default: false
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "pyproject.toml"
      - ".github/workflows/build.yaml"
  workflow_call:
  schedule:
    - cron: "7 10 * * *"
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions: {}
jobs:
  build:
    name: 🏗️ Build distributions
    uses: tox-dev/github-workflows/.github/workflows/build-maturin-wheels.yaml@9389742ac547afdfd13f32ac3fbeeb7c286e88bc # 6.8.2
    with:
      package-name: simplint
      matrix: >-
        [ {"os": "ubuntu-26.04", "target": "aarch64", "artifact": "linux-aarch64", "manylinux": "2_28", "args": "--zig"}, {"os": "ubuntu-26.04", "target": "aarch64-unknown-linux-musl", "artifact": "linux-aarch64-musl", "manylinux": "musllinux_1_2", "args": "--zig"}, {"os": "ubuntu-26.04", "target": "riscv64gc-unknown-linux-gnu", "artifact": "linux-riscv64gc", "manylinux": "2_31"}, {"os": "windows-11-arm", "target": "aarch64", "artifact": "windows-aarch64"}, {"os": "macos-26", "target": "x86_64", "artifact": "macos-x86_64"} ]
      pre-build-command: ${{ !startsWith(github.ref, 'refs/tags/') && 'cargo install cargo-edit --version 0.13.13 --locked && cargo set-version --bump patch' || '' }}
      # sccache saves one cache entry per compiled object, which crowds the larger caches out of the repository quota.
      release-build: true
    permissions:
      contents: read
      pull-requests: read
  maturin:
    name: ⚙️ Read locked maturin version
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.maturin.outputs.version }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Set up Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          enable-cache: false
          python-version: "3.15"
      - name: 📦 Install locked build tool
        uses: tox-dev/github-workflows/install-locked-tools@6.8.2
        with:
          groups: release-build
          venv: ${{ runner.temp }}/release-tools
      - name: ⚙️ Read locked maturin version
        id: maturin
        shell: bash
        run: |
          version=$("$RUNNER_TEMP/release-tools/bin/maturin" --version)
          printf 'version=v%s\n' "${version#maturin }" >>"$GITHUB_OUTPUT"
  pgo:
    name: 🏗️ PGO wheels
    needs: maturin
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.pgo) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # PGO legs stay here: each needs an instrumented build, a training run, and a profile check in one job.
        # The shared workflow builds every other leg and the sdist.
        platform:
          - {runner: ubuntu-26.04, target: x86_64, manylinux: "2_28", pgo: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-26.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, pgo: x86_64-unknown-linux-musl}
          - {runner: windows-2025, target: x64, pgo: x86_64-pc-windows-msvc}
          - {runner: macos-26, target: aarch64, pgo: aarch64-apple-darwin}
    env:
      PGO_TARGET: ${{ matrix.platform.pgo }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ⚙️ Read source timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"
      - name: 🐍 Set up Python
        uses: astral-sh/setup-uv@v10.3.3
        env:
          UV_VENV_SEED: "true"
        with:
          ignore-empty-workdir: true
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: "3.15"
      - name: ⚙️ Read package version
        id: version
        shell: bash
        run: echo "version=$(python tasks/cargo_version.py Cargo.toml)" >>"$GITHUB_OUTPUT"
      - name: ⚙️ Read Rust toolchain channel
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >>"$GITHUB_OUTPUT"
      - name: 📦 Restore PGO profile
        id: profile
        uses: actions/cache/restore@v6.1.0
        with:
          path: pgo/simplint.profdata
          key: pgo-profile-${{ matrix.platform.pgo }}-${{ steps.version.outputs.version }}-${{ github.sha }}-rust${{ steps.toolchain.outputs.channel }}-maturin${{ needs.maturin.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'tasks/pgo*') }}
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: llvm-tools-preview
          cache: false
      - name: 🏗️ Build instrumented binary
        if: ${{ steps.profile.outputs.cache-hit != 'true' }}
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: ${{ needs.maturin.outputs.version }}
          target: ${{ matrix.platform.target }}
          args: --locked --release --out target/pgo-wheels --target-dir target/pgo-build
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          docker-options: --env SOURCE_DATE_EPOCH
          sccache: false
        env:
          RUSTFLAGS: -Cprofile-generate
      - name: 📦 Restore PGO corpus
        id: corpus
        if: ${{ steps.profile.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: pgo-corpus
          key: pgo-corpus-${{ runner.os }}-${{ hashFiles('tasks/pgo_corpus.toml') }}
      - name: 🏋️ Collect PGO profile
        if: ${{ steps.profile.outputs.cache-hit != 'true' }}
        shell: bash
        # The profile lives outside target, which the Linux build container creates as root.
        run: python -m tasks.pgo train "target/pgo-build/$PGO_TARGET/release/simplint" pgo --cache pgo-corpus
      - name: 💾 Save PGO corpus
        if: ${{ steps.profile.outputs.cache-hit != 'true' && steps.corpus.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: pgo-corpus
          key: ${{ steps.corpus.outputs.cache-primary-key }}
      - name: 💾 Save PGO profile
        if: ${{ steps.profile.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: pgo/simplint.profdata
          key: ${{ steps.profile.outputs.cache-primary-key }}
      - name: ⚙️ Use PGO profile
        shell: bash
        run: |
          flags="-Cprofile-use=$GITHUB_WORKSPACE/pgo/simplint.profdata -Cllvm-args=-pgo-warn-missing-function"
          echo "RUSTFLAGS=$flags" >>"$GITHUB_ENV"
          echo "PGO_BUILD_LOG=$GITHUB_WORKSPACE/pgo/build.log" >>"$GITHUB_ENV"
      - name: 🏗️ Build wheels
        if: ${{ startsWith(matrix.platform.runner, 'ubuntu') }}
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: ${{ needs.maturin.outputs.version }}
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist --target-dir target
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          docker-options: --env SOURCE_DATE_EPOCH --env PGO_BUILD_LOG
          sccache: false
          before-script-linux: |
            if [[ -n "${PGO_BUILD_LOG:-}" ]]; then
              maturin() { command maturin "$@" 2>&1 | tee "$PGO_BUILD_LOG"; }
            fi
      - name: 🏗️ Build wheels with PGO
        if: ${{ !startsWith(matrix.platform.runner, 'ubuntu') }}
        shell: bash
        run: |
          uvx --from "maturin==${MATURIN_VERSION#v}" maturin build --locked --release --out dist --target-dir target \
            --target "$PGO_TARGET" 2>&1 | tee pgo/build.log
        env:
          MATURIN_VERSION: ${{ needs.maturin.outputs.version }}
      - name: 🔍 Check the PGO profile matched
        shell: bash
        run: python -m tasks.pgo verify pgo/build.log pgo/simplint.profdata
      - name: 📤 Upload wheels
        uses: actions/upload-artifact@v7.0.2
        with:
          name: simplint-wheels-pgo-${{ matrix.platform.target }}
          path: dist
          if-no-files-found: error
