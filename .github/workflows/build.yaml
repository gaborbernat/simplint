name: Compare ARM64 function folding
on:
  workflow_dispatch:
permissions: {}
jobs:
  maturin:
    name: ⚙️ Read locked maturin version
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.maturin.outputs.version }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Set up Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          enable-cache: false
          python-version: "3.15"
      - name: 📦 Install locked build tool
        uses: tox-dev/github-workflows/install-locked-tools@6.8.5
        with:
          groups: release-build
          venv: ${{ runner.temp }}/release-tools
      - name: ⚙️ Read locked maturin version
        id: maturin
        shell: bash
        run: |
          version=$("$RUNNER_TEMP/release-tools/bin/maturin" --version)
          printf 'version=v%s\n' "${version#maturin }" >>"$GITHUB_OUTPUT"
  pgo:
    name: 🏗️ PGO wheels
    needs: maturin
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # PGO legs stay here: each needs an instrumented build, a training run, and a profile check in one job.
        # The shared workflow builds every other leg and the sdist.
        platform:
          - {runner: ubuntu-26.04-arm, target: aarch64, manylinux: "2_28", pgo: aarch64-unknown-linux-gnu, bolt: true}
    env:
      PGO_TARGET: ${{ matrix.platform.pgo }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ⚙️ Read source timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >>"$GITHUB_ENV"
      - name: 🐍 Set up Python
        uses: astral-sh/setup-uv@v10.3.3
        env:
          UV_VENV_SEED: "true"
        with:
          ignore-empty-workdir: true
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: "3.15"
      - name: ⚙️ Read package version
        id: version
        shell: bash
        run: echo "version=$(python tasks/cargo_version.py Cargo.toml)" >>"$GITHUB_OUTPUT"
      - name: ⚙️ Read Rust toolchain channel
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >>"$GITHUB_OUTPUT"
      - name: 📦 Restore PGO profile
        id: profile
        uses: actions/cache/restore@v6.1.0
        with:
          path: pgo/simplint.profdata
          key: pgo-profile-${{ matrix.platform.pgo }}-${{ steps.version.outputs.version }}-83ee91ad822d640b28f7bd96df805f28fd3782cf-rust${{ steps.toolchain.outputs.channel }}-maturin${{ needs.maturin.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'tasks/pgo*') }}
      - name: 🦀 Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: llvm-tools-preview
          cache: false
      # link.exe writes unreadable function names into the ARM64 training profile.
      - name: Locate the ARM64 Windows profiling linker
        if: ${{ matrix.platform.pgo == 'aarch64-pc-windows-msvc' && steps.profile.outputs.cache-hit != 'true' }}
        id: profiler
        shell: pwsh
        run: |
          $linker = Join-Path (rustc --print sysroot) "lib/rustlib/$env:PGO_TARGET/bin/rust-lld.exe"
          "linker=$linker" >> $env:GITHUB_OUTPUT
      - name: 🏗️ Build instrumented binary
        if: ${{ steps.profile.outputs.cache-hit != 'true' }}
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: ${{ needs.maturin.outputs.version }}
          target: ${{ matrix.platform.target }}
          args: --locked --release --out target/pgo-wheels --target-dir target/pgo-build
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          docker-options: --env SOURCE_DATE_EPOCH
          sccache: false
        env:
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER: ${{ steps.profiler.outputs.linker }}
          RUSTFLAGS: -Cprofile-generate
      - name: 📦 Restore PGO corpus
        id: corpus
        if: ${{ steps.profile.outputs.cache-hit != 'true' || matrix.platform.bolt }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: pgo-corpus
          key: pgo-corpus-${{ runner.os }}-${{ hashFiles('tasks/pgo_corpus.toml') }}
      - name: 🏋️ Collect PGO profile
        if: ${{ steps.profile.outputs.cache-hit != 'true' }}
        shell: bash
        # The profile lives outside target, which the Linux build container creates as root.
        run: python -m tasks.pgo train "target/pgo-build/$PGO_TARGET/release/simplint" pgo --cache pgo-corpus
      - name: 💾 Save PGO corpus
        if: ${{ steps.profile.outputs.cache-hit != 'true' && steps.corpus.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: pgo-corpus
          key: ${{ steps.corpus.outputs.cache-primary-key }}
      - name: 💾 Save PGO profile
        if: ${{ steps.profile.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: pgo/simplint.profdata
          key: ${{ steps.profile.outputs.cache-primary-key }}
      - name: ⚙️ Use PGO profile
        shell: bash
        run: |
          flags="-Cprofile-use=$GITHUB_WORKSPACE/pgo/simplint.profdata -Cllvm-args=-pgo-warn-missing-function"
          echo "RUSTFLAGS=$flags" >>"$GITHUB_ENV"
          echo "PGO_BUILD_LOG=$GITHUB_WORKSPACE/pgo/build.log" >>"$GITHUB_ENV"
      - name: 🏗️ Build wheels
        if: ${{ startsWith(matrix.platform.runner, 'ubuntu') }}
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: ${{ needs.maturin.outputs.version }}
          target: ${{ matrix.platform.target }}
          args: >-
            --locked --release --out dist --target-dir target ${{ matrix.platform.bolt && '-- -Cstrip=none -Clink-arg=-Wl,--emit-relocs,-T,tasks/bolt.ld' || '' }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          docker-options: --env SOURCE_DATE_EPOCH --env PGO_BUILD_LOG
          sccache: false
          before-script-linux: |
            if [[ -n "${PGO_BUILD_LOG:-}" ]]; then
              maturin() { command maturin "$@" 2>&1 | tee "$PGO_BUILD_LOG"; }
            fi
      - name: 🏗️ Build wheels with PGO
        if: ${{ !startsWith(matrix.platform.runner, 'ubuntu') }}
        shell: bash
        run: |
          uvx --from "maturin==${MATURIN_VERSION#v}" maturin build --locked --release --out dist --target-dir target \
            --target "$PGO_TARGET" 2>&1 | tee pgo/build.log
        env:
          MATURIN_VERSION: ${{ needs.maturin.outputs.version }}
      - name: 🔍 Check the PGO profile matched
        shell: bash
        run: python -m tasks.pgo verify pgo/build.log pgo/simplint.profdata
      - name: ⚡ Optimize the Linux executable
        if: ${{ matrix.platform.bolt }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bolt-22 python3-wheel
          work=$(mktemp -d)
          /usr/bin/python3 -m wheel unpack --dest "$work/wheel" dist/*.whl
          binary=("$work"/wheel/*/*.data/scripts/simplint)
          python -m tasks.pgo download pgo-corpus --extract "$work/corpus"
          instrument=()
          if [[ "$PGO_TARGET" == aarch64-* ]]; then
            instrument+=(-no-lse-atomics)
            export RAYON_NUM_THREADS=1
          fi
          llvm-bolt-22 "${binary[0]}" "${instrument[@]}" -instrument -instrumentation-file="$work/profile" -o "$work/train"
          status=0
          "$work/train" check --config tasks/pgo.toml --no-cache "$work/corpus" > /dev/null || status=$?
          if (( status > 1 )); then exit "$status"; fi
          cp "${binary[0]}" "$work/original"
          mkdir layout
          cp "$work/profile" layout/profile
          mv dist layout/unoptimized-wheels
          for variant in control dist; do
            options=()
            if [[ "$variant" == dist ]]; then options+=(-icf=safe); fi
            llvm-bolt-22 "$work/original" -data="$work/profile" -reorder-blocks=ext-tsp -reorder-functions=cdsort \
              -split-functions -split-all-cold "${options[@]}" -o "$work/optimized"
            strip --strip-all --remove-section=.note.bolt_info -o "${binary[0]}" "$work/optimized"
            chmod +x "${binary[0]}"
            "${binary[0]}" --version
            mkdir -p "$variant"
            /usr/bin/python3 -m wheel pack --dest-dir "$variant" "$work"/wheel/*
          done
      - name: Save the unoptimized wheel and profile
        uses: actions/upload-artifact@v7.0.2
        with:
          name: arm64-layout-inputs
          path: layout/
          retention-days: 3
      - name: Compare cold checks
        run: python -m tasks.wheel_trial
      - name: Upload paired wheels and timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: measurements-${{ matrix.platform.pgo }}
          path: |
            control/
            dist/
            totals.txt
            measurements.csv
          if-no-files-found: warn
