name: Confirm wheel timings
on:
  workflow_dispatch:
    inputs:
      run:
        description: Run containing the control and candidate wheels
        type: string
        required: true
      control_run:
        description: Run containing the shipping control
        type: string
        default: ""
      control_wheel:
        description: Which wheel to use from the control run
        type: choice
        options:
          - dist
          - control
        default: dist
      candidate_wheel:
        description: Which wheel to measure from the candidate run
        type: choice
        options:
          - dist
          - control
        default: dist
      release_artifacts:
        description: Compare wheels from two release workflow runs
        type: boolean
        default: false
      targets:
        description: JSON list of target triples
        type: string
        required: true
permissions: {}
jobs:
  measure:
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    runs-on: ${{ fromJSON('{"x86_64-unknown-linux-gnu":"ubuntu-26.04","aarch64-unknown-linux-gnu":"ubuntu-26.04-arm","aarch64-unknown-linux-musl":"ubuntu-26.04-arm","x86_64-unknown-linux-musl":"ubuntu-26.04","aarch64-apple-darwin":"macos-26","x86_64-apple-darwin":"macos-26-intel","x86_64-pc-windows-msvc":"windows-2025","aarch64-pc-windows-msvc":"windows-11-arm"}')[matrix.target] }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          enable-cache: false
          activate-environment: true
          python-version: "3.15"
      - name: Download paired wheels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run }}
          TARGET: ${{ matrix.target }}
          CONTROL_RUN: ${{ inputs.control_run }}
          CONTROL_WHEEL: ${{ inputs.control_wheel }}
          CANDIDATE_WHEEL: ${{ inputs.candidate_wheel }}
          RELEASE_ARTIFACTS: ${{ inputs.release_artifacts }}
        run: |
          if [[ "$RELEASE_ARTIFACTS" == true ]]; then
            gh run download "$RUN_ID" --name "simplint-wheels-pgo-$TARGET" --dir wheel-pair/dist
            gh run download "$CONTROL_RUN" --name "simplint-wheels-pgo-$TARGET" --dir wheel-pair/control
            exit
          fi
          gh run download "$RUN_ID" --name "measurements-$TARGET" --dir wheel-pair
          if [[ -n "$CONTROL_RUN" ]]; then
            gh run download "$CONTROL_RUN" --name "measurements-$TARGET" --dir reference
            if [[ "$CANDIDATE_WHEEL" == control ]]; then
              mv wheel-pair/dist ordered
              mv wheel-pair/control wheel-pair/dist
            else
              mv wheel-pair/control matched-link
            fi
            mv "reference/$CONTROL_WHEEL" wheel-pair/control
          fi
      - name: Compare on the full source distributions
        shell: bash
        run: |
          mv wheel-pair/control wheel-pair/dist .
          python -m tasks.wheel_trial
      - name: Upload timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: confirmation-${{ matrix.target }}
          path: |
            measurements.csv
            totals.txt
          if-no-files-found: warn
