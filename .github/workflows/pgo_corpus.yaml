name: 🔀 pgo corpus
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"
  push:
    branches: ["main"]
    paths:
      - "tasks/pgo_corpus.toml"
permissions: {}
jobs:
  bump:
    name: 📦 Bump the PGO sdists
    if: github.event_name != 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
      # The release builds cache the downloads under the manifest's hash, so a merged bump starts a new cache.
      - name: ⚙️ Pin the newest sdists
        run: uv run --no-project --python 3.15 python -m tasks.pgo manifest
      - name: 🧹 Run prek
        run: uvx prek run --all-files
      # A run with nothing new opens no PR; the shared workflow rejects an empty patch.
      - name: 📝 Save the changes
        id: diff
        run: |
          git diff HEAD --binary >"$RUNNER_TEMP/maintenance.patch"
          if [ -s "$RUNNER_TEMP/maintenance.patch" ]; then echo "changed=true"; else echo "changed=false"; fi >>"$GITHUB_OUTPUT"
      - name: 📤 Upload maintenance patch
        id: upload
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: maintenance-patch
          path: ${{ runner.temp }}/maintenance.patch
          if-no-files-found: error
  bump-pr:
    name: 🔀 Open PGO sdists PR
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    uses: tox-dev/github-workflows/.github/workflows/open-maintenance-pr.yaml@81a3fc661be49ecdc4ea4af99a69fa3879b3d7a1 # 6.8.1
    with:
      artifact-id: ${{ needs.bump.outputs.artifact-id }}
      allowed-paths: tasks/pgo_corpus.toml
      branch: update-pgo-corpus
      title: Train PGO on the newest black, pip and botocore
      body: Pin the latest sdists of the projects profile-guided optimization trains on, so the profile follows current code.
      labels: skip news
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
  # A tag reads only its own caches and the default branch's, so the release builds find the sdists only if main saved
  # them; each runner OS keeps its own copy, as the release's PGO legs restore by OS.
  cache:
    name: 💾 Cache the PGO sdists @ ${{ matrix.os }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-26]
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: 📦 Restore PGO corpus
        id: corpus
        uses: actions/cache/restore@v6.1.0
        with:
          path: pgo-corpus
          key: pgo-corpus-${{ runner.os }}-${{ hashFiles('tasks/pgo_corpus.toml') }}
          lookup-only: true
      - name: 🐍 Install uv
        if: steps.corpus.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📥 Download the sdists
        if: steps.corpus.outputs.cache-hit != 'true'
        run: uv run --no-project --python 3.15 python -m tasks.pgo download pgo-corpus
      - name: 💾 Save PGO corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: pgo-corpus
          key: ${{ steps.corpus.outputs.cache-primary-key }}
