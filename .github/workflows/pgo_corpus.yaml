name: 🔀 pgo corpus
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"
permissions: {}
jobs:
  bump:
    name: 📦 Bump the PGO sdists
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
      # The release builds cache the downloads under the manifest's hash, so a merged bump starts a new cache.
      - name: ⚙️ Pin the newest sdists
        run: uv run tasks/pgo.py manifest
      - name: 🧹 Run prek
        run: uvx prek run --all-files
      - name: 📝 Save the changes
        run: git diff HEAD --binary >"$RUNNER_TEMP/changes.patch"
      - name: 📤 Upload corpus patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgo-corpus-patch
          path: ${{ runner.temp }}/changes.patch
          if-no-files-found: error
  bump-pr:
    name: 🔀 Open PGO sdists PR
    needs: bump
    uses: $/.github/workflows/app-pr.yaml
    with:
      kind: pgo-corpus
      branch: update-pgo-corpus
      title: Train PGO on the newest black, pip and botocore
      body: Pin the latest sdists of the projects profile-guided optimization trains on, so the profile follows current code.
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
