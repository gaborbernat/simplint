name: 🔀 pgo corpus
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"
permissions: {}
jobs:
  bump:
    name: 📦 Bump the PGO sdists
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
      # The release builds cache the downloads under the manifest's hash, so a merged bump starts a new cache.
      - name: ⚙️ Pin the newest sdists
        run: uv run tasks/pgo.py manifest
      - name: 🧹 Run prek
        run: uvx prek run --all-files
      # A run with nothing new opens no PR; the shared workflow rejects an empty patch.
      - name: 📝 Save the changes
        id: diff
        run: |
          git diff HEAD --binary >"$RUNNER_TEMP/maintenance.patch"
          if [ -s "$RUNNER_TEMP/maintenance.patch" ]; then echo "changed=true"; else echo "changed=false"; fi >>"$GITHUB_OUTPUT"
      - name: 📤 Upload maintenance patch
        id: upload
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-patch
          path: ${{ runner.temp }}/maintenance.patch
          if-no-files-found: error
  bump-pr:
    name: 🔀 Open PGO sdists PR
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    uses: tox-dev/github-workflows/.github/workflows/open-maintenance-pr.yaml@2c1f5e4ceda37c41eb8367b5cbeaa741aa60a566 # 6.5.2
    with:
      artifact-id: ${{ needs.bump.outputs.artifact-id }}
      allowed-paths: tasks/pgo_corpus.toml
      branch: update-pgo-corpus
      title: Train PGO on the newest black, pip and botocore
      body: Pin the latest sdists of the projects profile-guided optimization trains on, so the profile follows current code.
      labels: skip news
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
