default_language_version:
  python: python3.15
ci:
  autoupdate_schedule: quarterly
  # builds the linter from this checkout; pre-commit.ci has no Rust toolchain, so CI lints instead
  skip: [simplint]
repos:
  - repo: local
    hooks:
      - id: simplint
        name: lint the repository's Python with this checkout of simplint
        language: system
        entry: cargo run --quiet --locked -- check --fix
        types_or: [python, pyi]
        pass_filenames: false
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "50e0f3aee9dc5747a5f173f79a7417403c18dda6" # frozen: v2.30.3
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "c0f278f1254ccc8fb09676bcdb8d847e7db493e5" # frozen: v0.17.4
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: ["--fix", "--unsafe-fixes", "--exit-non-zero-on-fix"]
  - repo: https://github.com/google/yamlfmt
    rev: "21ca5323a9c87ee37a434e0ca908efc0a89daa07" # frozen: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/hukkin/mdformat
    rev: 82912cdaea4fb830f751504486a7879c70526547 # frozen: 1.0.0
    hooks:
      - id: mdformat
        args: ["--wrap", "120"]
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-ruff==0.1.3
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "a76b92851fc9eede9f9bc4073eb55202f34eb0df" # frozen: 0.39.0
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: '17e12779811926f000bdfa1795f9e3735dd71ac3' # frozen: 0.26
    hooks:
      - id: validate-pyproject
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
        # fixtures and snapshots spell out exact bytes, missing final newlines and trailing spaces included
        exclude: ^tests/(fixtures|snapshots)/
      - id: trailing-whitespace
        exclude: ^tests/(fixtures|snapshots)/
