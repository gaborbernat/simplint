# Settings for the PGO training run in tasks/pgo.py: every rule, preview ones included, so the profile covers each
# rule's check and fix path.
target-version = "py314"
line-length = 120
lint.select = [ "ALL" ]
lint.preview = true
# simplint refuses to run while Ruff asks for the docstrings its SMP901 and SMP902 remove.
lint.ignore = [ "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107" ]
