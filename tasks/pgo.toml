# Settings for the PGO training run in tasks/pgo.py: every rule, preview ones included, so the profile covers each
# rule's check and fix path.
target-version = "py314"
line-length = 120
lint.select = [ "ALL" ]
lint.preview = true
# simplint refuses to run while Ruff asks for the docstrings its function-docstring and test-module-docstring
# remove, or reports the inline `re.compile` its inline-regex moves to a module constant.
lint.ignore = [
  "undocumented-public-module",
  "undocumented-public-class",
  "undocumented-public-method",
  "undocumented-public-function",
  "undocumented-public-package",
  "undocumented-magic-method",
  "undocumented-public-nested-class",
  "undocumented-public-init",
  "unnecessary-regular-expression-compile",
]
