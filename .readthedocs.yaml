version: 2
build:
  os: ubuntu-lts-latest
  # Read the Docs needs one tool listed; uv brings the Python 3.15 the docs environment runs on.
  tools:
    python: "latest"
  commands:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - ~/.local/bin/uv tool install tox --with tox-uv -p 3.15 --managed-python
    - ~/.local/bin/tox run -e docs
