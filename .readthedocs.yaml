version: 2
build:
  os: ubuntu-lts-latest
  # uv installs the Python version pinned by the docs environment. Node.js runs mermaid-cli.
  tools:
    python: "latest"
    nodejs: "24"
  # Chrome's headless shell needs these libraries to render the diagrams. Liberation Sans supplies Arial-compatible
  # metrics for the labels.
  apt_packages:
    - fonts-liberation
    - libasound2t64
    - libatk-bridge2.0-0t64
    - libatk1.0-0t64
    - libcups2t64
    - libgbm1
    - libnss3
    - libpango-1.0-0
    - libxcomposite1
    - libxdamage1
    - libxkbcommon0
    - libxrandr2
  commands:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - ~/.local/bin/uv tool install tox --with tox-uv -p 3.15 --managed-python
    # Install the diagram renderer while tox prepares the Sphinx environment.
    - NO_COLOR=1 ~/.local/bin/uv run --no-project -p 3.15 python -m tasks.prepare_docs docs/conf.py ~/.local/bin/tox
    - NO_COLOR=1 ~/.local/bin/tox run --skip-pkg-install -e docs
